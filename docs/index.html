<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet Quinta de Tui Futsal</title>
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{--bg:#0d0d0d;--card:#181818;--line:#2c2c2c;--cream:#e8e0cc;--muted:#9a9488;--ok:#7bc47f;--warn:#e0b84f;--bad:#e06a5f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--cream);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:var(--cream)}
h1,h2,h3{margin:0 0 .6em;letter-spacing:.02em}
h1{font-size:1.4rem}h2{font-size:1.15rem}h3{font-size:1rem}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.top img{width:40px;height:40px;border-radius:50%}
.top .t{font-weight:700;letter-spacing:.05em;font-size:.95rem;flex:1}
.top select{max-width:46%}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.muted{color:var(--muted);font-size:.9rem}
.small{font-size:.82rem}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#101010;color:var(--cream);font-size:16px;font-family:inherit}
input[type=checkbox],input[type=radio]{width:auto;margin-right:8px;transform:scale(1.2)}
.chk{display:flex;align-items:flex-start;gap:4px;color:var(--cream);font-size:.9rem;margin:10px 0}
button{font-family:inherit;font-size:1rem;border-radius:10px;border:1px solid var(--cream);background:var(--cream);color:#0d0d0d;padding:11px 16px;font-weight:700;cursor:pointer}
button.sec{background:transparent;color:var(--cream)}
button.link{background:none;border:none;color:var(--muted);text-decoration:underline;padding:4px;font-weight:400;font-size:.85rem}
button:disabled{opacity:.5}
button.full{width:100%}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem;background:#101010;color:var(--cream);font-weight:500}
.chip.on{background:var(--cream);color:#0d0d0d;border-color:var(--cream)}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:700;letter-spacing:.04em}
.tag.activo{background:var(--ok);color:#0d0d0d}.tag.pendiente{background:var(--warn);color:#0d0d0d}.tag.caducado,.tag.baja{background:var(--bad);color:#0d0d0d}
.nav{position:fixed;left:0;right:0;bottom:0;background:#111;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
.nav button{flex:1;background:none;border:none;color:var(--muted);font-size:.72rem;padding:10px 2px 8px;font-weight:600;border-radius:0}
.nav button span{display:block;font-size:1.25rem;margin-bottom:2px}
.nav button.on{color:var(--cream)}
.carnet{position:relative;border-radius:18px;padding:18px;background:linear-gradient(145deg,#1f1f1f,#0a0a0a);border:1px solid #3a3a3a;overflow:hidden;margin-bottom:14px}
.carnet .crest{position:absolute;right:-40px;top:-40px;width:190px;opacity:.13;border-radius:50%}
.carnet .club{font-size:.72rem;letter-spacing:.18em;color:var(--muted)}
.carnet .name{font-size:1.45rem;font-weight:800;margin:6px 0 2px}
.carnet .no{font-size:.9rem;color:var(--muted)}
.carnet .qr{background:#fff;border-radius:10px;padding:8px;width:132px;margin-top:14px}
.carnet .qr img{width:100%;display:block}
.carnet .pts{position:absolute;right:18px;bottom:18px;text-align:right}
.carnet .pts b{font-size:2rem;display:block;line-height:1}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:.92rem}
.banner.warn{background:#3a3016;border:1px solid var(--warn)}
.banner.ok{background:#1d3320;border:1px solid var(--ok)}
.banner.bad{background:#3a1d1a;border:1px solid var(--bad)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:11px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.list li:last-child{border-bottom:none}
.list .grow{flex:1;min-width:0}
.match .date{font-size:.78rem;color:var(--muted)}
.score{font-weight:800;font-size:1.1rem;white-space:nowrap}
.logo{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#222;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.wheelbox{position:relative;width:280px;height:280px;margin:10px auto 16px}
.wheelbox svg{width:100%;height:100%;transition:transform 4.5s cubic-bezier(.17,.67,.12,1)}
.wheelbox .pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid var(--cream);z-index:2;filter:drop-shadow(0 2px 2px #000)}
.big{font-size:2.2rem;font-weight:800;text-align:center}
.goals{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0}
.goals input{width:70px;text-align:center;font-size:1.6rem;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .in{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
video{width:100%;border-radius:12px;background:#000}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--cream);color:#0d0d0d;padding:12px 18px;border-radius:12px;font-weight:700;z-index:60;display:none;max-width:90vw;text-align:center}
#toast.err{background:var(--bad)}
.subnav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.subnav .chip{white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:1.4rem}
.stats span{font-size:.72rem;color:var(--muted)}
.hero{text-align:center;padding:24px 0 8px}
.hero img{width:150px;border-radius:50%;margin-bottom:12px}
.person{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.center{text-align:center}
.mt{margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
</style>
</head>
<body>
<div id="app"><div class="wrap hero"><img src="escudo.jpg" alt=""><p class="muted">Cargando…</p></div></div>
<div id="toast"></div>
<script>
'use strict';
const CFG = window.QT_CONFIG;
const sb = supabase.createClient(CFG.url, CFG.key, {auth:{storageKey:'carnet-quinta'}});
const APP_URL = location.origin + location.pathname;
const $ = s => document.querySelector(s);
const app = $('#app');
const S = {user:null, cards:[], cur:null, teams:[], admin:false, tab:'carnet', atab:'resumen', settings:{}};

/* ---------- utilidades ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, err){const t=$('#toast');t.textContent=msg;t.className=err?'err':'';t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3500)}
async function rpc(fn, args){const {data,error}=await sb.rpc(fn,args||{}); if(error) throw new Error(cleanErr(error.message)); return data}
function cleanErr(m){return (m||'Error').replace(/^.*?ERROR:\s*/,'')}
async function guard(fn){try{return await fn()}catch(e){toast(e.message||String(e),true)}}
const fmtDate = d => new Date(d).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short',timeZone:'Europe/Madrid'});
const fmtTime = d => new Date(d).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Madrid'});
const fmtDay = d => d ? new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}) : '';
function qrImg(text, cell){const q=qrcode(0,'M');q.addData(text);q.make();return q.createDataURL(cell||6,2)}
const cur = () => S.cards.find(c => c.id === S.cur) || S.cards[0];
const statusTxt = s => ({activo:'ACTIVO',pendiente:'PENDIENTE DE PAGO',caducado:'CADUCADO',baja:'BAJA'}[s]||s);
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="in">'+html+'</div>';m.addEventListener('click',e=>{if(e.target===m)closeModal()});document.body.appendChild(m);return m}
function closeModal(){stopScan();document.querySelectorAll('.modal').forEach(m=>m.remove())}

/* ---------- arranque ---------- */
async function boot(){
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  const hash = location.hash;
  if(hash.startsWith('#comercio')) return renderMerchantSignup();
  const m = hash.match(/[#&]([cp])=([0-9a-f]+)/i);
  if(m) ssSet('qt_code', m[1]+':'+m[2]);
  const st = hash.match(/^#(gol|calendario|aficionado|ruleta|navidad|loteria)$/); if(st) ssSet('qt_story', st[1]);
  const inv = hash.match(/^#invita-(\d+)$/); if(inv) lsSet('qt_ref', inv[1]);
  const gf = hash.match(/^#regalo-([0-9a-f]+)$/); if(gf) ssSet('qt_gift', gf[1]);
  if(hash) history.replaceState(null,'',location.pathname);
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return renderLogin();
  S.user = session.user;
  await afterLogin();
}
function ssSet(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}
function ssGet(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
function ssDel(k){try{sessionStorage.removeItem(k)}catch(e){}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
async function afterLogin(){
  const g = ssGet('qt_gift');
  if(g){ssDel('qt_gift'); try{const r=await rpc('claim_gift',{p_code:g}); S.cur=r.id; S.giftOpened=true}catch(e){toast(e.message,true)}}
  await loadAll();
  const story = ssGet('qt_story');
  if(story && S.cards.length){ssDel('qt_story'); modal(storyHTML(story)+'<button class="full mt" onclick="closeModal()">Ir a mi carnet</button>')}
  if(S.giftOpened){S.giftOpened=false; const c=cur(); modal(`<div class="center"><img src="escudo.jpg" style="width:110px;border-radius:50%"><h2>¡Bienvenido a la Quinta, ${esc(c.first_name)}!</h2><p>Este carnet es un regalo. Ya eres socio nº ${c.member_no}.</p><p class="muted small">Elige en «Partidos» los equipos que quieres seguir.</p><button class="full" onclick="closeModal()">Ver mi carnet</button></div>`)}
}

/* ---------- finales de las historias de los WhatsApp ---------- */
const STORIES = {
  gol:{t:'Era su abuelo.',p:['Socio número 12.','Esa mañana se levantó temprano, cogió el coche y se sentó en la grada sin avisar a nadie.','Cuando su nieto lo vio, se olvidó de seguir celebrando. Subió corriendo a abrazarlo.','El abuelo sumó unos puntos en su carnet. Su nieto, un recuerdo para toda la vida.'],c:'Hazte socio y no te pierdas ningún gol.'},
  calendario:{t:'En su móvil estaba todo.',p:['Hora, pabellón y rival del partido de mañana. Y el resultado del sábado pasado.','Sin buscar entre 214 mensajes. Sin esperar a que alguien conteste.','Es el carnet de socio de la Quinta. Eliges el equipo de tu hijo y lo tienes siempre a mano.'],c:'Los avisos oficiales siguen llegando por el grupo del equipo. El carnet no lo sustituye: lo tiene todo ordenado.'},
  aficionado:{t:'Gol.',p:['El señor de la gorra es socio número 31.','No tiene a nadie en la pista. Pero con su carnet ayuda a que jueguen 224 chavales en un club donde juegan todos.','Y de paso, ahorra en los comercios de Tui.'],c:'No hace falta tener un hijo en la Quinta para ser de la Quinta.'},
  ruleta:{t:'+10 puntos.',p:['No era el regalo de la semana. Esta vez no.','Pero mañana es el día siete. Y el día siete vale doble.','Ya ha puesto la alarma.'],c:'Con el carnet de socio, los niños juegan cada día, suman puntos y los cambian por premios del club.'},
  navidad:{t:'«¿A qué hora juegas el sábado?»',p:['Dentro del sobre estaba su carnet de socio de la Quinta. Con su nombre.','Y una nota con letra torcida: «Para que no te pierdas ningún gol».'],c:'Regala un carnet estas Navidades. Con el pack familiar, cada carnet más cuesta 6 €, y te damos una tarjeta regalo lista para imprimir.'},
  loteria:{t:'Esto es una historia.',p:['No sabemos si este año tocará.','Pero si te haces socio antes del 20 de diciembre, llevas 5 € del número de la Quinta.','Y la lotería de la Quinta solo la pueden comprar los socios.'],c:'Una participación por alta, para el titular adulto.'}
};
function storyHTML(k){const s=STORIES[k]; if(!s) return '';
  return `<div class="box"><h2>${esc(s.t)}</h2>${s.p.map(x=>`<p>${esc(x)}</p>`).join('')}<p><b>${esc(s.c)}</b></p></div>`}
async function loadAll(){
  const [teams, cards, admin, sets] = await Promise.all([
    sb.from('teams').select('id,name,category,is_flagship,sort,active').eq('active',true).order('sort').order('name'),
    rpc('my_cards'), rpc('is_admin'), sb.from('settings').select('key,value')
  ]);
  S.teams = teams.data || []; S.cards = cards || []; S.admin = !!admin;
  S.settings = Object.fromEntries((sets.data||[]).map(r=>[r.key,r.value]));
  if(!S.cards.find(c=>c.id===S.cur)) S.cur = (S.cards[0]||{}).id;
  if(!S.cards.length && !S.admin) return renderAlta();
  if(!S.cards.length && S.admin && S.tab!=='admin') S.tab='admin';
  render();
  const code = sessionStorage.getItem('qt_code');
  if(code && cur()){sessionStorage.removeItem('qt_code'); doScan(code)}
}

/* ---------- login por código al email ---------- */
function renderLogin(){
  const story = ssGet('qt_story'), gift = ssGet('qt_gift');
  app.innerHTML = `<div class="wrap"><div class="hero"><img src="escudo.jpg" alt="Escudo"><h1>Carnet de socio</h1><p class="muted">Quinta de Tui Futsal</p></div>
  ${story?storyHTML(story):''}<div id="giftintro"></div>
  <div class="box"><h2>${gift?'Abre tu carnet':'Entra o hazte socio'}</h2><p class="muted small">Te mandamos un código a tu email. Sin contraseñas.</p>
  <label>Tu email</label><input id="em" type="email" autocomplete="email" inputmode="email" placeholder="tu@email.com">
  <button class="full mt" id="b1">Enviarme el código</button>
  <div id="step2" style="display:none"><label>Código que te ha llegado</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="123456">
  <button class="full mt" id="b2">Entrar</button><p class="muted small">¿No te llega? Mira en spam o promociones.</p></div></div>
  <p class="center"><a class="muted small" href="#comercio" onclick="setTimeout(boot)">¿Tienes un comercio? Únete al carnet</a></p></div>`;
  $('#b1').onclick = () => guard(async()=>{
    const email=$('#em').value.trim().toLowerCase(); if(!/^\S+@\S+\.\S+$/.test(email)) throw new Error('Revisa el email');
    $('#b1').disabled=true;
    const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});
    $('#b1').disabled=false; if(error) throw new Error(error.message);
    $('#step2').style.display='block'; $('#b1').textContent='Reenviar código'; $('#otp').focus(); toast('Código enviado');
  });
  $('#b2').onclick = () => guard(async()=>{
    const {data,error}=await sb.auth.verifyOtp({email:$('#em').value.trim().toLowerCase(),token:$('#otp').value.trim(),type:'email'});
    if(error) throw new Error('Código incorrecto o caducado');
    S.user=data.user; await afterLogin();
  });
  if(gift) rpc('gift_info',{p_code:gift}).then(g=>{ if(g) $('#giftintro').innerHTML=`<div class="banner ok"><b>${esc(g.first_name)}, te han regalado el carnet de socio de la Quinta.</b><br>Entra con tu email para abrirlo. No tienes que rellenar nada más.</div>`}).catch(()=>{});
}

/* ---------- alta de socios ---------- */
let altaPeople = [];
async function renderAlta(extra){
  const prefill = extra ? [] : await rpc('clubber_prefill').catch(()=>[]);
  const pr = S.settings.precios || {individual:12,familiar:6,protector:[30,50]};
  if(!altaPeople.length){
    altaPeople = prefill.length ? prefill.map(p=>({first_name:p.first_name||'',last_name:p.last_name||'',birth_date:p.birth_date||'',relation:'jugador',teams:S.teams.filter(t=>p.team_name&&t.name.toLowerCase()===p.team_name.toLowerCase()).map(t=>t.id)}))
                                : [{first_name:'',last_name:'',birth_date:'',relation:'familiar',teams:[]}];
  }
  const hasCards = S.cards.length>0;
  const story = ssGet('qt_story');
  app.innerHTML = `<div class="wrap"><div class="hero" style="padding-top:8px"><img src="escudo.jpg" style="width:90px"><h1>${hasCards?'Añadir carnets':'Hazte socio'}</h1></div>
  ${story&&!hasCards?storyHTML(story):''}
  ${prefill.length?`<div class="banner ok">Ya te teníamos en el club: hemos rellenado tus datos. Revísalos y confirma.</div>`:''}
  <div class="box"><p class="muted small">Un carnet por persona. ${hasCards?'Cada carnet más de tu familia cuesta '+pr.familiar+' €.':'El primero cuesta '+pr.individual+' € al año y cada uno más de tu familia, '+pr.familiar+' €.'} Si es menor de 14 años, el alta la hace su padre o su madre.</p>
  <div id="people"></div><button class="sec full" id="addp">+ Añadir otra persona de la familia</button></div>
  ${hasCards?'':`<div class="box"><h3>Socio protector (opcional)</h3><p class="muted small">Si quieres ayudar más al club, tu carnet puede ser de protector. Saldrás en el muro de agradecimiento.</p>
  <div class="chips" id="prot"><button class="chip on" data-v="">Normal</button>${(pr.protector||[]).map(v=>`<button class="chip" data-v="${v}">Protector ${v} €</button>`).join('')}</div></div>`}
  <div class="box">${hasCards?'':`<label>¿Te ha invitado un socio? Su número de socio</label><input id="ref" inputmode="numeric" value="${esc(lsGet('qt_ref')||'')}" placeholder="Opcional">`}
  <label>Tu teléfono móvil</label><input id="tel" type="tel" inputmode="tel" placeholder="600 000 000" value="${esc((prefill[0]||{}).phone||'')}">
  <div class="chk"><input type="checkbox" id="cc"><span>Quiero recibir noticias, avisos y ventajas del club por email y en la app.</span></div>
  <div class="chk"><input type="checkbox" id="pp"><span>He leído y acepto el tratamiento de mis datos por Quinta de Tui Futsal para gestionar el carnet de socio.</span></div>
  <div id="total" class="big mt"></div>
  <button class="full mt" id="go">Confirmar alta</button>
  ${hasCards?'<button class="link full" onclick="altaPeople=[];render()">Cancelar</button>':'<button class="link full" onclick="logout()">Salir</button>'}</div></div>`;
  let protector = '';
  const draw = () => {
    $('#people').innerHTML = altaPeople.map((p,i)=>`<div class="person"><div class="row"><b>Persona ${i+1}</b>${altaPeople.length>1?`<button class="link" style="flex:0" onclick="altaPeople.splice(${i},1);renderAltaKeep()">Quitar</button>`:''}</div>
      <div class="grid2"><div><label>Nombre</label><input data-i="${i}" data-k="first_name" value="${esc(p.first_name)}"></div><div><label>Apellidos</label><input data-i="${i}" data-k="last_name" value="${esc(p.last_name)}"></div></div>
      <div class="grid2"><div><label>Fecha de nacimiento</label><input type="date" data-i="${i}" data-k="birth_date" value="${esc(p.birth_date)}"></div>
      <div><label>Relación con el club</label><select data-i="${i}" data-k="relation">${['jugador','familiar','aficionado'].map(r=>`<option ${p.relation===r?'selected':''}>${r}</option>`).join('')}</select></div></div>
      <div class="chk"><input type="checkbox" data-i="${i}" data-k="gift" ${p.gift?'checked':''}><span>Es un regalo para otra persona. Te damos una tarjeta regalo para imprimir y su carnet se abre con un QR.</span></div>
      <label>Equipos que sigue</label><div class="chips">${S.teams.map(t=>`<button class="chip ${p.teams.includes(t.id)?'on':''}" data-i="${i}" data-t="${t.id}">${esc(t.name)}</button>`).join('')||'<span class="muted small">Aún no hay equipos cargados</span>'}</div></div>`).join('');
    $('#people').querySelectorAll('input,select').forEach(el=>el.oninput=()=>{altaPeople[+el.dataset.i][el.dataset.k]=el.type==='checkbox'?el.checked:el.value});
    $('#people').querySelectorAll('[data-t]').forEach(el=>el.onclick=()=>{const p=altaPeople[+el.dataset.i],t=+el.dataset.t;p.teams=p.teams.includes(t)?p.teams.filter(x=>x!==t):[...p.teams,t];draw()});

let scanStream=null, scanRAF=null;
function openScanner(){
  const c=cur(); if(c.status!=='activo') return toast('Tu carnet tiene que estar activo para sumar puntos',true);
  modal(`<h2>Escanear QR</h2><video id="vid" playsinline muted></video><canvas id="cv" style="display:none"></canvas>
   <p class="muted small">Apunta al QR del mostrador o del cartel del partido.</p>
   <label>¿No funciona la cámara? Escribe el código</label><div class="row"><input id="manual" placeholder="código"><button style="flex:0" onclick="manualScan()">OK</button></div>
   <button class="sec full mt" onclick="closeModal()">Cerrar</button>`);
  navigator.mediaDevices?.getUserMedia({video:{facingMode:'environment'}}).then(st=>{
    scanStream=st; const v=$('#vid'); if(!v) return stopScan(); v.srcObject=st; v.play();
    const cv=$('#cv'), ctx=cv.getContext('2d',{willReadFrequently:true});
    const tick=()=>{ if(!scanStream) return;
      if(v.readyState===v.HAVE_ENOUGH_DATA){cv.width=v.videoWidth;cv.height=v.videoHeight;ctx.drawImage(v,0,0);
        const r=jsQR(ctx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);
        if(r&&r.data){const m=r.data.match(/[#?&]([cp])=([0-9a-f]+)/i); if(m){closeModal();return doScan(m[1]+':'+m[2])}}}
      scanRAF=requestAnimationFrame(tick)};
    tick();
  }).catch(()=>toast('No se pudo abrir la cámara. Escribe el código.',true));
}
function stopScan(){if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}cancelAnimationFrame(scanRAF)}
function manualScan(){const v=$('#manual').value.trim();closeModal();doScan(v.includes(':')?v:'c:'+v)}
async function doScan(code){
  const c=cur(); if(!c) return;
  guard(async()=>{const r=await rpc('scan_code',{p_member:c.id,p_code:code});
    modal(`<div class="center"><div class="big">+${r.points}</div><p>${esc(r.text)}</p><button class="full" onclick="closeModal()">¡Genial!</button></div>`);
    await refreshCards(); render();});
}

      <button class="full" id="pb" ${c.status!=='activo'?'disabled':''}>${mine?'Cambiar mi pronóstico':'Guardar pronóstico'}</button>
      <p class="muted small">Ganador: ${pts.porra_ganador||3} puntos. Resultado exacto: ${pts.porra_exacto||10} puntos. Se cierra al empezar el partido. Algunas semanas, sin avisar, hay premio sorpresa entre los que aciertan el resultado exacto.</p>`;

function wheelSVG(segs){
  const n=segs.length, r=140, a=2*Math.PI/n; let s='';
  segs.forEach((v,i)=>{const a0=i*a-Math.PI/2, a1=a0+a;
    const x0=r+r*Math.cos(a0), y0=r+r*Math.sin(a0), x1=r+r*Math.cos(a1), y1=r+r*Math.sin(a1);
    const am=a0+a/2, tx=r+r*.66*Math.cos(am), ty=r+r*.66*Math.sin(am);
    s+=`<path d="M${r},${r} L${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1} Z" fill="${i%2?'#e8e0cc':'#1c1c1c'}" stroke="#555"/>
        <text x="${tx}" y="${ty}" fill="${i%2?'#0d0d0d':'#e8e0cc'}" font-size="22" font-weight="800" text-anchor="middle" dominant-baseline="middle" transform="rotate(${am*180/Math.PI+90} ${tx} ${ty})">+${v}</text>`});
  return `<svg viewBox="0 0 280 280">${s}<circle cx="140" cy="140" r="26" fill="#0d0d0d" stroke="#e8e0cc" stroke-width="3"/></svg>`;
}

  const {data,error}=await sb.from('merchants').select('id,name,category,discount,address,phone,web,logo_url').order('name');
  if(error) throw error;
  el.innerHTML = `<h2>Comercios con descuento</h2><p class="muted small">Enseña tu carnet al pagar y escanea el QR del mostrador: sumas ${(S.settings.puntos||{}).comercio||15} puntos (una vez al día por comercio).</p>
   <button class="full" onclick="openScanner()">📷 Escanear QR del comercio</button>
   <div class="box mt">${data.length?`<ul class="list">${data.map(m=>`<li>${m.logo_url?`<img class="logo" src="${esc(m.logo_url)}" alt="">`:`<div class="logo">${esc(m.name[0]||'')}</div>`}
     <div class="grow"><b>${esc(m.name)}</b>${m.category?` <span class="muted small">· ${esc(m.category)}</span>`:''}<div>${esc(m.discount)}</div>
     <div class="muted small">${esc(m.address||'')}${m.phone?' · <a href="tel:'+esc(m.phone)+'">'+esc(m.phone)+'</a>':''}</div></div></li>`).join('')}</ul>`:'<p class="muted">Pronto habrá comercios aquí.</p>'}</div>
   <p class="center"><a class="muted small" href="#comercio" onclick="setTimeout(boot)">¿Conoces un comercio que quiera unirse?</a></p>`;
}

/* ---------- Puntos y premios ---------- */
async function viewPuntos(el, c){
  const [pz, led, rd] = await Promise.all([
    sb.from('prizes').select('id,name,description,cost_points,stock,sponsor,image_url').eq('active',true).order('cost_points'),
    sb.from('points_ledger').select('delta,reason,created_at').eq('member_id',c.id).order('created_at',{ascending:false}).limit(40),
    sb.from('redemptions').select('id,status,created_at,prizes(name)').eq('member_id',c.id).order('created_at',{ascending:false}).limit(20)]);
  el.innerHTML = `<div class="box center"><div class="muted">Tienes</div><div class="big">${c.points}</div><div class="muted">puntos</div></div>
   <div class="box"><h3>Premios</h3>${(pz.data||[]).length?`<ul class="list">${pz.data.map(p=>`<li><div class="grow"><b>${esc(p.name)}</b>${p.sponsor?` <span class="muted small">· ${esc(p.sponsor)}</span>`:''}
     ${p.description?`<div class="muted small">${esc(p.description)}</div>`:''}${p.stock!=null?`<div class="muted small">Quedan ${p.stock}</div>`:''}</div>
     <button style="flex:0;white-space:nowrap" ${c.points<p.cost_points||c.status!=='activo'||p.stock===0?'disabled':''} onclick="redeem(${p.id},'${esc(p.name).replace(/'/g,'')}',${p.cost_points})">${p.cost_points} pts</button></li>`).join('')}</ul>`:'<p class="muted small">Pronto habrá premios.</p>'}</div>
   ${(rd.data||[]).length?`<div class="box"><h3>Tus canjes</h3><ul class="list small">${rd.data.map(r=>`<li><div class="grow">${esc(r.prizes?.name)}</div><span class="tag ${r.status==='entregado'?'activo':'pendiente'}">${r.status.toUpperCase()}</span></li>`).join('')}</ul><p class="muted small">Los premios pendientes los recoges en el club enseñando tu carnet.</p></div>`:''}
   <div class="box"><h3>Movimientos</h3>${(led.data||[]).length?`<ul class="list small">${led.data.map(l=>`<li><div class="grow">${esc(l.reason)}<div class="muted small">${fmtDate(l.created_at)}</div></div><b>${l.delta>0?'+':''}${l.delta}</b></li>`).join('')}</ul>`:'<p class="muted small">Aún no tienes movimientos. ¡Tira de la ruleta!</p>'}</div>`;
}
function redeem(id, name, cost){
  modal(`<h2>¿Canjear?</h2><p>${esc(name)} por <b>${cost} puntos</b>.</p><div class="row"><button class="sec" onclick="closeModal()">No</button><button id="okr">Sí, canjear</button></div>`);
  $('#okr').onclick=()=>guard(async()=>{await rpc('redeem_prize',{p_member:cur().id,p_prize:id});closeModal();toast('¡Canjeado! Recógelo en el club.');await refreshCards();render()});
}

/* ======================= PANEL DE GESTIÓN ======================= */
async function viewAdmin(el){
  const subs=[['resumen','Resumen'],['socios','Socios'],['partidos','Equipos y partidos'],['comercios','Comercios'],['premios','Premios'],['sorpresas','Sorpresas'],['loteria','Lotería y regalos'],['carteles','Carteles'],['ajustes','Ajustes']];
  el.innerHTML = `<div class="subnav">${subs.map(s=>`<button class="chip ${S.atab===s[0]?'on':''}" data-a="${s[0]}">${s[1]}</button>`).join('')}</div><div id="adm"><p class="muted">Cargando…</p></div>`;
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{S.atab=b.dataset.a;render()});
  const box=$('#adm');
  await ({resumen:aResumen,socios:aSocios,partidos:aPartidos,comercios:aComercios,premios:aPremios,sorpresas:aSorpresas,loteria:aLoteria,carteles:aCarteles,ajustes:aAjustes}[S.atab])(box);
}

   <p class="small mt">Alta de comercios:<br><b>${esc(APP_URL)}#comercio</b></p><div class="row"><button class="sec" onclick="copy('${esc(APP_URL)}#comercio')">Copiar</button><button class="sec" onclick="printQR('${esc(APP_URL)}#comercio','Únete al carnet de socio','Escanea para apuntar tu comercio')">QR para imprimir</button></div></div>`;

function copy(t){navigator.clipboard?.writeText(t).then(()=>toast('Copiado'))}

async function aSocios(b, q){
  q=q||'';
  const list=await rpc('admin_members',{p_search:q});
  b.innerHTML=`<div class="row"><input id="q" placeholder="Buscar por nombre, email, teléfono o nº" value="${esc(q)}"><button style="flex:0" id="qb">Buscar</button></div>
   <p class="muted small">Cuando recibas el pago, pulsa Activar: el carnet queda activo hasta el 31 de agosto (las altas de julio y agosto, hasta el 31 de agosto siguiente).</p>
   <div class="box"><ul class="list">${list.map(m=>`<li><div class="grow"><b>${esc(m.first_name)} ${esc(m.last_name)}</b> <span class="muted small">nº ${m.member_no}</span> <span class="tag ${m.status}">${m.status.toUpperCase()}</span>${m.is_protector?' <span class="tag" style="border:1px solid var(--cream)">PROTECTOR</span>':''}
     <div class="muted small">${esc(m.email||'')} ${esc(m.phone||'')} · ${(+m.price).toFixed(0)} € · ${m.points} pts${m.paid_until?' · hasta '+fmtDay(m.paid_until):''}</div><div class="muted small">${esc(m.teams||'')}</div></div>
     <div style="display:flex;flex-direction:column;gap:4px;flex:none"><button onclick="actMember('${m.id}')">${m.status==='pendiente'?'Activar':'Renovar'}</button><button class="sec" onclick="addPts('${m.id}')">± pts</button></div></li>`).join('')||'<li class="muted">Sin socios</li>'}</ul></div>`;
  $('#qb').onclick=()=>aSocios(b,$('#q').value.trim()); $('#q').onkeydown=e=>{if(e.key==='Enter')aSocios(b,$('#q').value.trim())};
}
function actMember(id){guard(async()=>{await rpc('admin_activate',{p_member:id,p_months:12});toast('Carnet activado 1 año');aSocios($('#adm'),($('#q')||{}).value||'')})}
function addPts(id){
  modal(`<h3>Sumar o restar puntos</h3><label>Puntos (negativo para restar)</label><input id="pd" type="number" inputmode="numeric"><label>Motivo</label><input id="pr" placeholder="Ej.: participación en el torneo">
   <div class="row mt"><button class="sec" onclick="closeModal()">Cancelar</button><button id="pok">Guardar</button></div>`);
  $('#pok').onclick=()=>guard(async()=>{await rpc('admin_add_points',{p_member:id,p_delta:+$('#pd').value,p_reason:$('#pr').value});closeModal();toast('Hecho');aSocios($('#adm'))});
}

async function aPartidos(b){
  const {data:teams}=await sb.from('teams').select('id,name,category,federation_url,is_flagship,sort,active').order('sort').order('name');
  const from=new Date(Date.now()-14*864e5).toISOString();
  const {data:ms}=await sb.from('matches').select('id,team_id,starts_at,is_home,rival,venue,goals_for,goals_against,finished').gte('starts_at',from).order('starts_at').limit(200);
  const tn=Object.fromEntries((teams||[]).map(t=>[t.id,t.name]));
  b.innerHTML=`<div class="box"><h3>Equipos</h3><ul class="list small">${(teams||[]).map(t=>`<li><div class="grow"><b>${esc(t.name)}</b> ${t.is_flagship?'<span class="tag activo">PRIMER EQUIPO</span>':''} <span class="muted">${esc(t.category||'')}</span></div>
     <button class="sec" style="flex:0" onclick="toggleTeam(${t.id},${!t.active})">${t.active?'Ocultar':'Mostrar'}</button></li>`).join('')||'<li class="muted">Añade los 18 equipos aquí.</li>'}</ul>
     <label>Nuevo equipo</label><div class="grid2"><input id="tn" placeholder="Nombre (ej.: Alevín A)"><input id="tc" placeholder="Categoría"></div>
     <div class="chk"><input type="checkbox" id="tf"><span>Es el primer equipo (senior preferente): porra y puntos dobles</span></div><button id="tadd">Añadir equipo</button></div>
   <div class="box"><h3>Nuevo partido</h3><p class="muted small">Más adelante se cargarán solos desde la Federación. Mientras, se pueden meter aquí.</p>
     <label>Equipo</label><select id="mt">${(teams||[]).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select>
     <div class="grid2"><div><label>Fecha y hora</label><input id="md" type="datetime-local"></div><div><label>Rival</label><input id="mr"></div></div>
     <div class="grid2"><div><label>Pabellón</label><input id="mv"></div><div><label>&nbsp;</label><div class="chk"><input type="checkbox" id="mh" checked><span>En casa</span></div></div></div>
     <button id="madd">Añadir partido</button></div>
   <div class="box"><h3>Partidos y resultados</h3><p class="muted small">Goles de Quinta primero. Al guardar un resultado se reparten solos los puntos de la porra.</p>
     <ul class="list small">${(ms||[]).map(m=>`<li><div class="grow"><div class="muted">${fmtDate(m.starts_at)} ${fmtTime(m.starts_at)} · ${esc(tn[m.team_id])} · ${m.is_home?'casa':'fuera'}</div><b>vs ${esc(m.rival)}</b></div>
       ${m.finished?`<span class="score">${m.goals_for}-${m.goals_against}</span>`:`<input style="width:52px" id="gf${m.id}" inputmode="numeric"><input style="width:52px" id="ga${m.id}" inputmode="numeric"><button style="flex:0" onclick="saveRes(${m.id})">OK</button>`}</li>`).join('')||'<li class="muted">Sin partidos</li>'}</ul></div>`;
  $('#tadd').onclick=()=>guard(async()=>{const n=$('#tn').value.trim(); if(!n) throw new Error('Pon el nombre');
    const {error}=await sb.from('teams').insert({name:n,category:$('#tc').value.trim()||null,is_flagship:$('#tf').checked,sort:(teams||[]).length}); if(error) throw error; await reloadTeams(); aPartidos(b)});
  $('#madd').onclick=()=>guard(async()=>{const d=$('#md').value, r=$('#mr').value.trim(); if(!d||!r) throw new Error('Falta fecha o rival');
    const {error}=await sb.from('matches').insert({team_id:+$('#mt').value,starts_at:new Date(d).toISOString(),rival:r,venue:$('#mv').value.trim()||null,is_home:$('#mh').checked}); if(error) throw error; toast('Partido añadido'); aPartidos(b)});
}
async function reloadTeams(){const {data}=await sb.from('teams').select('id,name,category,is_flagship,sort,active').eq('active',true).order('sort').order('name');S.teams=data||[]}
function toggleTeam(id,a){guard(async()=>{const {error}=await sb.from('teams').update({active:a}).eq('id',id);if(error)throw error;await reloadTeams();aPartidos($('#adm'))})}
function saveRes(id){guard(async()=>{const f=$('#gf'+id).value,a=$('#ga'+id).value; if(f===''||a==='') throw new Error('Pon los dos marcadores');
  const {error}=await sb.from('matches').update({goals_for:+f,goals_against:+a,finished:true}).eq('id',id); if(error) throw error; toast('Resultado guardado'); aPartidos($('#adm'))})}

   <div class="box"><ul class="list">${list.map(m=>`<li><div class="grow"><b>${esc(m.name)}</b> ${m.approved?(m.active?'<span class="tag activo">ACTIVO</span>':'<span class="tag baja">PAUSADO</span>'):'<span class="tag pendiente">POR APROBAR</span>'}
     <div class="small">${esc(m.discount)}</div><div class="muted small">${esc(m.contact_name||'')} ${esc(m.contact_email||'')} ${esc(m.phone||'')}</div>
     <div class="muted small">Visitas de socios (30 días): ${m.visitas_30d}</div>
     <label class="small">Logo (enlace a imagen)</label><div class="row"><input id="lg${m.id}" value="${esc(m.logo_url||'')}" placeholder="https://…"><button class="sec" style="flex:0" onclick="saveLogo(${m.id})">OK</button></div></div>

   <div class="box"><h3>Añadir comercio a mano</h3><p class="muted small">Para los 9 que ya tenéis: rellena el formulario de alta y apruébalo aquí.</p><a href="#comercio" onclick="setTimeout(boot)"><button class="sec">Abrir formulario</button></a></div>`;

function merchSet(id,patch){guard(async()=>{const {error}=await sb.from('merchants').update(patch).eq('id',id);if(error)throw error;aComercios($('#adm'))})}
function merchDel(id){guard(async()=>{const {error}=await sb.from('merchants').delete().eq('id',id);if(error)throw error;aComercios($('#adm'))})}
function saveLogo(id){merchSet(id,{logo_url:$('#lg'+id).value.trim()||null})}

async function aPremios(b){

  b.innerHTML=`<div class="box"><h3>Premios por entregar</h3><ul class="list small">${rd.filter(r=>r.status==='pendiente').map(r=>`<li><div class="grow"><b>${esc(r.prize)}</b><div class="muted">${esc(r.socio)} · nº ${r.member_no} · ${fmtDate(r.created_at)}</div></div><button style="flex:0" onclick="deliver(${r.id})">Entregado</button></li>`).join('')||'<li class="muted">Nada pendiente</li>'}</ul></div>
   <div class="box"><h3>Catálogo</h3><ul class="list small">${(pz||[]).map(p=>`<li><div class="grow"><b>${esc(p.name)}</b> · ${p.cost_points} pts${p.stock!=null?' · quedan '+p.stock:''}${p.sponsor?' · '+esc(p.sponsor):''}</div><button class="sec" style="flex:0" onclick="prizeSet(${p.id},{active:${!p.active}})">${p.active?'Ocultar':'Mostrar'}</button></li>`).join('')||'<li class="muted">Sin premios</li>'}</ul>
   <h3 class="mt">Nuevo premio</h3><label>Nombre</label><input id="pn" placeholder="Bufanda del club"><label>Descripción</label><input id="pdsc">
   <div class="grid2"><div><label>Puntos</label><input id="pc" type="number" inputmode="numeric"></div><div><label>Unidades (vacío = sin límite)</label><input id="ps" type="number" inputmode="numeric"></div></div>
   <label>Lo regala (comercio o patrocinador)</label><input id="psp"><button class="mt" id="padd">Añadir premio</button></div>`;
  $('#padd').onclick=()=>guard(async()=>{const n=$('#pn').value.trim(),c=+$('#pc').value; if(!n||!c) throw new Error('Pon nombre y puntos');
    const {error}=await sb.from('prizes').insert({name:n,description:$('#pdsc').value.trim()||null,cost_points:c,stock:$('#ps').value===''?null:+$('#ps').value,sponsor:$('#psp').value.trim()||null}); if(error) throw error; aPremios(b)});
}
function prizeSet(id,patch){guard(async()=>{const {error}=await sb.from('prizes').update(patch).eq('id',id);if(error)throw error;aPremios($('#adm'))})}
function deliver(id){guard(async()=>{await rpc('admin_deliver',{p_redemption:id});aPremios($('#adm'))})}

  b.innerHTML=`<div class="box"><h3>Regalo semanal de la ruleta</h3><p class="muted small">El sistema elige solo un día y una hora al azar de esa semana (ni tú la sabes). El primer socio que tire después, se lo lleva.</p>
    <label>Semana</label><input id="gw" type="date" value="${new Date().toISOString().slice(0,10)}"><label>Regalo</label><input id="gg" placeholder="Camiseta del club"><label>Lo regala (opcional)</label><input id="gs">
    <button class="mt" id="gok">Programar regalo</button></div>
   <div class="box"><h3>Premio sorpresa de la porra</h3><p class="muted small">Se asigna a un partido del primer equipo al azar de las próximas 4 semanas. Se sortea entre los que acierten el resultado exacto.</p>
    <label>Premio</label><input id="jg" placeholder="Vale de 20 € en…"><button class="mt" id="jok">Programar premio</button></div>
   <div class="box"><h3>Historial</h3><ul class="list small">${g.map(x=>`<li><div class="grow"><b>${esc(x.tipo)}</b> · ${fmtDay(x.fecha)}<div>${esc(x.gift)}</div><div class="muted">${x.ganador?'Ganador: '+esc(x.ganador):'Todavía sin ganador'}</div></div>
     ${x.ganador&&!x.delivered?`<button style="flex:0" onclick="giftDone('${x.tipo}','${x.ref}')">Entregado</button>`:x.delivered?'<span class="tag activo">ENTREGADO</span>':''}</li>`).join('')||'<li class="muted">Nada programado</li>'}</ul></div>`;
  $('#gok').onclick=()=>guard(async()=>{if(!$('#gg').value.trim()) throw new Error('Pon el regalo'); await rpc('admin_weekly_gift',{p_week:$('#gw').value,p_gift:$('#gg').value.trim(),p_sponsor:$('#gs').value.trim()||null}); toast('Regalo programado'); aSorpresas(b)});
  $('#jok').onclick=()=>guard(async()=>{if(!$('#jg').value.trim()) throw new Error('Pon el premio'); await rpc('admin_porra_jackpot',{p_gift:$('#jg').value.trim()}); toast('Premio programado en un partido secreto'); aSorpresas(b)});
}
function giftDone(t,r){guard(async()=>{await rpc('admin_gift_delivered',{p_tipo:t,p_ref:r});aSorpresas($('#adm'))})}

async function aLoteria(b){
  const [lot, rw, gc] = await Promise.all([rpc('admin_lottery'), rpc('admin_rewards'), rpc('admin_gift_cards')]);
  const st={pendiente:'PENDIENTE',pagada:'PAGADA',entregada:'ENTREGADA'};
  b.innerHTML=`<div class="box"><h3>Lotería</h3><p class="muted small">Regalos por alta y pedidos de socios. Márcalos al cobrar y al entregar.</p>
    <ul class="list small">${lot.map(l=>`<li><div class="grow"><b>${l.kind==='regalo'?'Regalo por alta':l.qty+' participaciones · '+(+l.amount).toFixed(0)+' €'}</b><div class="muted">${esc(l.socio||'')} · ${esc(l.contacto||'')}</div></div>
      <span class="tag ${l.status==='entregada'?'activo':'pendiente'}">${st[l.status]}</span>
      ${l.status==='pendiente'&&l.kind==='compra'?`<button style="flex:0" onclick="lotSet(${l.id},'pagada')">Pagada</button>`:''}${l.status!=='entregada'?`<button class="sec" style="flex:0" onclick="lotSet(${l.id},'entregada')">Entregada</button>`:''}</li>`).join('')||'<li class="muted">Nada todavía</li>'}</ul>
    <p class="muted small">Total participaciones: ${lot.reduce((a,l)=>a+l.qty,0)}</p></div>
   <div class="box"><h3>Premios de «Trae a un socio»</h3><ul class="list small">${rw.map(r=>`<li><div class="grow"><b>${esc(r.reward)}</b> (${r.milestone} socios)<div class="muted">${esc(r.socio)}</div></div>${r.delivered?'<span class="tag activo">ENTREGADO</span>':`<button style="flex:0" onclick="rwDone(${r.id})">Entregado</button>`}</li>`).join('')||'<li class="muted">Nadie ha llegado aún a un premio</li>'}</ul></div>
   <div class="box"><h3>Carnets regalados</h3><ul class="list small">${gc.map(g=>`<li><div class="grow"><b>${esc(g.destinatario)}</b> · nº ${g.member_no} <span class="tag ${g.status}">${g.status.toUpperCase()}</span><div class="muted">Lo regala: ${esc(g.regala||'')}</div></div>${g.gift_claimed_at?'<span class="tag activo">ABIERTO</span>':'<span class="tag pendiente">SIN ABRIR</span>'}</li>`).join('')||'<li class="muted">Ninguno</li>'}</ul></div>`;
}
function lotSet(id,st){guard(async()=>{await rpc('admin_lottery_set',{p_id:id,p_status:st});aLoteria($('#adm'))})}
function rwDone(id){guard(async()=>{await rpc('admin_reward_delivered',{p_id:id});aLoteria($('#adm'))})}
async function aCarteles(b){
  const today=new Date(), d=today.getDay(), mon=new Date(today); mon.setDate(today.getDate()-((d+6)%7)); const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const iso=x=>x.toISOString().slice(0,10);
  b.innerHTML=`<div class="box"><h3>Carteles de asistencia</h3><p class="muted small">Un QR distinto por partido en casa. Solo vale durante el partido y una vez por persona. Imprímelos y pégalos en la puerta del pabellón.</p>
    <div class="grid2"><div><label>Desde</label><input id="cf" type="date" value="${iso(mon)}"></div><div><label>Hasta</label><input id="ct" type="date" value="${iso(sun)}"></div></div>
    <button class="mt" id="cgo">Generar carteles para imprimir</button></div>
   <div class="box"><h3>Cartel fijo de alta</h3><p class="muted small">Para plastificar y dejar en la entrada del pabellón. Siempre lleva al alta de socios, no caduca.</p>
    <button class="sec" onclick="printQR(APP_URL,'¿Eres de la Quinta?','Escanea y hazte socio en un minuto')">Imprimir cartel de alta</button></div>`;
  $('#cgo').onclick=()=>guard(async()=>{
    const ms=await rpc('admin_home_matches',{p_from:$('#cf').value,p_to:$('#ct').value});
    if(!ms.length) throw new Error('No hay partidos en casa en esas fechas');
    const pts=S.settings.puntos||{};
    printPages(ms.map(m=>({title:`${m.team} vs ${m.rival}`, sub:`${fmtDate(m.starts_at)} · ${fmtTime(m.starts_at)}${m.venue?' · '+m.venue:''}`,
      url:`${APP_URL}#p=${m.attendance_code}`, foot:`Socio: escanea con tu carnet y suma ${(pts.asistencia||10)*(m.is_flagship?(pts.multiplicador_preferente||2):1)} puntos`})));
  });
}
function printQR(url,title,foot){printPages([{title,sub:'',url,foot}])}
function printPages(pages){
  const w=window.open('','_blank'); if(!w) return toast('Permite las ventanas emergentes para imprimir',true);
  w.document.write(`<html><head><title>Carteles</title><style>body{margin:0;font-family:system-ui,sans-serif}.p{page-break-after:always;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;box-sizing:border-box}
   .p img.e{width:160px;border-radius:50%}.p img.q{width:60vmin;max-width:420px;margin:20px 0}h1{font-size:34px;margin:12px 0 4px}h2{font-size:22px;font-weight:500;margin:0;color:#444}p{font-size:22px;font-weight:700}</style></head><body>
   ${pages.map(p=>`<div class="p"><img class="e" src="${APP_URL.replace(/[^/]*$/,'')}escudo.jpg"><h1>${esc(p.title)}</h1><h2>${esc(p.sub)}</h2><img class="q" src="${qrImg(p.url,10)}"><p>${esc(p.foot)}</p><small>Carnet de socio · Quinta de Tui Futsal</small></div>`).join('')}
   <script>setTimeout(()=>print(),600)<\/script></body></html>`);
  w.document.close();
}

async function aAjustes(b){
  const pago=(S.settings.pago||{}).texto||'';
  b.innerHTML=`<div class="box"><h3>Cómo pagar (mientras no haya pago online)</h3><p class="muted small">Lo ven los socios pendientes de pago. Puedes usar {numero} para su nº de socio.</p>
    <textarea id="pt" rows="3" placeholder="Haz un Bizum al 6XX XXX XXX con el concepto 'Carnet {numero}'.">${esc(pago)}</textarea><button class="mt" id="pok">Guardar</button></div>
   <div class="box"><h3>Lotería de Navidad</h3><p class="muted small">Con cada alta activada hasta la fecha límite se regala una participación al titular. Solo los socios pueden pedir más.</p>
    <div class="chk"><input type="checkbox" id="la" ${(S.settings.loteria||{}).activa?'checked':''}><span>Lotería activa</span></div>
    <div class="grid2"><div><label>Número</label><input id="ln" value="${esc((S.settings.loteria||{}).numero||'')}"></div><div><label>Importe participación (€)</label><input id="li" type="number" value="${(S.settings.loteria||{}).importe||5}"></div></div>
    <label>Fecha límite</label><input id="lh" type="date" value="${(S.settings.loteria||{}).hasta||''}"><button class="mt" id="lok">Guardar</button></div>
   <div class="box"><h3>Importar socios de Clubber</h3><p class="muted small">Exporta de Clubber un CSV con nombre, apellidos, email, teléfono, fecha de nacimiento y equipo. Cuando esa familia se dé de alta con su email, sus datos aparecerán ya rellenados. Al importar se sustituye la lista anterior.</p>
    <input type="file" id="csv" accept=".csv,text/csv"><div id="cprev" class="muted small mt"></div></div>`;
  $('#pok').onclick=()=>guard(async()=>{const {error}=await sb.from('settings').upsert({key:'pago',value:{texto:$('#pt').value.trim()}});if(error)throw error;S.settings.pago={texto:$('#pt').value.trim()};toast('Guardado')});
  $('#lok').onclick=()=>guard(async()=>{const v={activa:$('#la').checked,numero:$('#ln').value.trim(),importe:+$('#li').value||5,hasta:$('#lh').value};
    const {error}=await sb.from('settings').upsert({key:'loteria',value:v});if(error)throw error;S.settings.loteria=v;toast('Guardado')});
  $('#csv').onchange=e=>{const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>previewCSV(r.result); r.readAsText(f,'utf-8')};
}
function parseCSV(t){
  t=t.replace(/^﻿/,''); const sep=(t.split('\n')[0].match(/;/g)||[]).length>(t.split('\n')[0].match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true; else if(ch===sep){row.push(f);f=''} else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''} else f+=ch}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
function previewCSV(text){
  const rows=parseCSV(text); if(rows.length<2) return toast('El archivo está vacío',true);
  const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const H=rows[0].map(norm); const find=(...k)=>H.findIndex(h=>k.some(x=>h.includes(x)));
  const ix={email:find('email','correo','e-mail'),phone:find('movil','telefono','phone','tlf'),first_name:find('nombre','name'),last_name:find('apellido','surname'),birth:find('nacimiento','birth','fecha nac'),team:find('equipo','team','categoria')};
  if(ix.last_name===ix.first_name) ix.first_name=H.findIndex((h,i)=>h.includes('nombre')&&i!==ix.last_name);
  const date=s=>{s=(s||'').trim();let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:''};
  const g=(r,i)=>i>=0?(r[i]||'').trim():'';
  const data=rows.slice(1).map(r=>({email:g(r,ix.email),phone:g(r,ix.phone),first_name:g(r,ix.first_name),last_name:g(r,ix.last_name),birth_date:date(g(r,ix.birth)),team_name:g(r,ix.team)})).filter(r=>r.email||r.phone);
  const miss=Object.entries(ix).filter(([k,v])=>v<0).map(([k])=>k);
  $('#cprev').innerHTML=`${data.length} personas encontradas.${miss.length?' No encuentro las columnas: '+miss.join(', ')+'.':''}<br>Ejemplo: ${esc(JSON.stringify(data[0]||{}))}<br><button class="mt" id="cimp">Importar ${data.length}</button>`;
  $('#cimp').onclick=()=>guard(async()=>{const n=await rpc('admin_import_clubber',{p_rows:data});toast(n+' importados');$('#cprev').textContent=n+' personas importadas.'});
}

sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'){S.user=null} });
boot().catch(e=>{app.innerHTML=`<div class="wrap"><div class="banner bad">No se pudo cargar: ${esc(e.message)}</div><button onclick="location.reload()">Reintentar</button></div>`});
