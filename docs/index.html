<!doctype html>
<html lang="es">
<head>

<meta property="og:description" content="Hazte socio en un minuto. Descuentos en Tui, el calendario de tu equipo, juegos y premios. #EUSONDEAQUINTA">

<style>
/* Tema: claro (crema) por defecto; oscuro con el botón sol/luna. Mismas variables en el panel. */
:root{--bg:#EEE7D6;--card:#F8F3E8;--field:#FFFCF5;--line:#D3C8B0;--cream:#161412;--muted:#5C564B;
 --ok:#1F6B3B;--okbg:#E1F0E6;--warn:#8D5300;--warnbg:#FBEED6;--bad:#A3221A;--badbg:#F8E0DE;
 --f1:#FCF8EF;--f2:#E8DEC6;--edge:#C4B696;--sh:rgba(70,50,20,.22);--hi:rgba(255,255,255,.9);
 --p1:#2C2926;--p2:#131210;--pink:#F1EAD8;--pedge:#000;--phi:rgba(255,255,255,.14);
 --nav:#F7F2E6;--well:#E3D9C2;--display:"Oswald","Arial Narrow",Arial,sans-serif;color-scheme:light}
:root[data-theme="dark"]{--bg:#0E0D0C;--card:#181715;--field:#121110;--line:#2E2B27;--cream:#EEE6D3;--muted:#A59E90;
 --ok:#7BC47F;--okbg:#1D3320;--warn:#E0B84F;--warnbg:#3A3016;--bad:#E06A5F;--badbg:#3A1D1A;
 --f1:#2B2926;--f2:#1A1917;--edge:#030303;--sh:rgba(0,0,0,.6);--hi:rgba(255,255,255,.08);
 --p1:#F3ECDB;--p2:#D8CEB6;--pink:#141210;--pedge:#8F8570;--phi:rgba(255,255,255,.7);
 --nav:#151413;--well:#121110;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--cream);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
a{color:var(--cream)}
h1,h2,h3{margin:0 0 .6em;letter-spacing:.01em;font-family:var(--display);font-weight:600}
h1{font-size:1.6rem}h2{font-size:1.3rem}h3{font-size:1.08rem;font-weight:500}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:12px;padding:14px 64px 10px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
.top img{width:40px;height:40px;border-radius:50%;box-shadow:0 2px 6px var(--sh)}
.top .t{font-family:var(--display);font-weight:600;letter-spacing:.08em;font-size:1.05rem;flex:1;line-height:1.15}
.top .t .muted{font-family:"Barlow",sans-serif;letter-spacing:0;font-weight:500}
.top select{max-width:46%}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.muted{color:var(--muted);font-size:.9rem}
.small{font-size:.84rem}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px;font-weight:500}
input,select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--cream);font-size:16px;font-family:inherit;box-shadow:inset 0 1px 3px var(--sh)}
input[type=checkbox],input[type=radio]{width:auto;margin-right:8px;transform:scale(1.2);box-shadow:none;accent-color:var(--cream)}
.chk{display:flex;align-items:flex-start;gap:4px;color:var(--cream);font-size:.9rem;margin:10px 0}
/* Botones con relieve: principal (oscuro en claro, crema en oscuro) y secundario */
button{font-family:var(--display);font-size:1.05rem;letter-spacing:.02em;font-weight:500;border-radius:14px;border:1px solid var(--pedge);background:linear-gradient(180deg,var(--p1),var(--p2));color:var(--pink);padding:12px 18px;min-height:46px;cursor:pointer;box-shadow:inset 0 1px 0 var(--phi),0 3px 0 var(--pedge),0 10px 18px -8px var(--sh);transition:transform .08s ease,box-shadow .08s ease;display:inline-flex;align-items:center;justify-content:center;gap:10px}
button:active{transform:translateY(3px);box-shadow:inset 0 1px 0 var(--phi),0 0 0 var(--pedge),0 4px 8px -6px var(--sh)}
button.sec{background:linear-gradient(180deg,var(--f1),var(--f2));color:var(--cream);border-color:var(--line);box-shadow:inset 0 1px 0 var(--hi),0 3px 0 var(--edge),0 10px 18px -8px var(--sh)}
button.sec:active{box-shadow:inset 0 1px 0 var(--hi),0 0 0 var(--edge),0 4px 8px -6px var(--sh)}
button.link{background:none;border:none;color:var(--muted);text-decoration:underline;padding:4px;font-family:inherit;font-weight:400;font-size:.88rem;letter-spacing:0;min-height:0;box-shadow:none;display:inline}
button.link:active{transform:none}
button:disabled{opacity:.5}
button.full{width:100%;display:flex}
button svg,.ico svg{width:22px;height:22px;flex:none}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.88rem;background:linear-gradient(180deg,var(--f1),var(--f2));color:var(--cream);font-family:"Barlow",sans-serif;font-weight:600;letter-spacing:0;min-height:0;box-shadow:inset 0 1px 0 var(--hi),0 2px 0 var(--edge)}
.chip.on{background:linear-gradient(180deg,var(--p1),var(--p2));color:var(--pink);border-color:var(--pedge);box-shadow:inset 0 1px 0 var(--phi),0 2px 0 var(--pedge)}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:700;letter-spacing:.04em}
.tag.activo{background:var(--okbg);color:var(--ok)}.tag.pendiente{background:var(--warnbg);color:var(--warn)}.tag.caducado,.tag.baja{background:var(--badbg);color:var(--bad)}
/* Mosaico de botones grandes (pantallas limpias: el detalle va dentro) */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.tile{flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;min-height:108px;padding:16px;border-radius:18px;font-size:1.1rem}
.tile .ico{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--well);box-shadow:inset 0 2px 4px var(--sh)}
/* Barra inferior: iconos de línea propios; el activo con sello y un leve despintado */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);border-top:1px solid var(--line);box-shadow:0 -8px 20px -12px var(--sh);display:flex;padding:8px 4px calc(10px + env(safe-area-inset-bottom));z-index:10}
.nav button{flex:1;flex-direction:column;gap:3px;background:none;border:none;box-shadow:none;color:var(--muted);font-family:"Barlow",sans-serif;font-size:.72rem;letter-spacing:0;padding:2px 0;min-height:52px;font-weight:600;border-radius:0}
.nav button:active{transform:none;box-shadow:none}
.nav .pill{position:relative;width:54px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:15px}
.nav .pill svg{position:relative;width:22px;height:22px}
.nav button.on{color:var(--cream)}
.nav button.on .pill{color:var(--bg)}
.nav button.on .pill::before{content:"";position:absolute;inset:0;border-radius:15px;background:var(--cream);-webkit-mask-image:radial-gradient(circle at 30% 40%,transparent 0 .55px,#000 1px),radial-gradient(circle at 70% 60%,transparent 0 .7px,#000 1.2px);-webkit-mask-size:9px 11px,15px 13px;-webkit-mask-composite:source-in;mask-image:radial-gradient(circle at 30% 40%,transparent 0 .55px,#000 1px),radial-gradient(circle at 70% 60%,transparent 0 .7px,#000 1.2px);mask-size:9px 11px,15px 13px;mask-composite:intersect}
/* Botón sol/luna, pequeño, arriba a la derecha */
#themebtn{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:30;width:40px;height:40px;min-height:0;padding:0;border-radius:50%;background:linear-gradient(180deg,var(--f1),var(--f2));color:var(--cream);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi),0 2px 0 var(--edge),0 6px 12px -4px var(--sh)}
#themebtn svg{width:18px;height:18px}
/* La tarjeta del carnet es siempre negra, como una tarjeta física */
.carnet{position:relative;border-radius:22px;padding:20px;background:linear-gradient(145deg,#262421,#0B0B0A);border:1px solid #34312C;overflow:hidden;margin-bottom:16px;color:#EEE6D3;box-shadow:0 4px 0 #000,0 18px 30px -12px rgba(40,28,10,.5)}
.carnet .crest{position:absolute;right:-40px;top:-40px;width:190px;opacity:.13;border-radius:50%}
.carnet .club{font-size:.72rem;letter-spacing:.16em;color:#B8B0A0}
.carnet .name{font-family:var(--display);font-size:1.75rem;font-weight:600;margin:8px 0 2px;line-height:1.1}
.carnet .no,.carnet .muted{color:#B8B0A0}
.carnet .tag.activo{background:#1D3320;color:#8FD3A3}.carnet .tag.pendiente{background:#3A3016;color:#E0B84F}.carnet .tag.caducado,.carnet .tag.baja{background:#3A1D1A;color:#F2968C}
.carnet .qr{background:#F4EEDF;border-radius:12px;padding:8px;width:132px;margin-top:14px}
.carnet .qr img{width:100%;display:block}
.carnet .pts{position:absolute;right:20px;bottom:18px;text-align:right}
.carnet .pts b{font-family:var(--display);font-size:2.1rem;font-weight:600;display:block;line-height:1}
.banner{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:.92rem}
.banner.warn{background:var(--warnbg);border:1px solid var(--warn)}
.banner.ok{background:var(--okbg);border:1px solid var(--ok)}
.banner.bad{background:var(--badbg);border:1px solid var(--bad)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:11px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.list li:last-child{border-bottom:none}
.list .grow{flex:1;min-width:0}
.match .date{font-size:.78rem;color:var(--muted)}
.score{font-family:var(--display);font-weight:600;font-size:1.2rem;white-space:nowrap}
.logo{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--well);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.wheelbox{position:relative;width:280px;height:280px;margin:10px auto 16px}
.wheelbox svg{width:100%;height:100%;transition:transform 4.5s cubic-bezier(.17,.67,.12,1)}
.wheelbox .pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid var(--cream);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.big{font-family:var(--display);font-size:2.4rem;font-weight:600;text-align:center}
.goals{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0}
.goals input{width:70px;text-align:center;font-size:1.6rem;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(20,16,10,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .in{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;max-width:440px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 40px -10px rgba(0,0,0,.45)}
video{width:100%;border-radius:12px;background:#000}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--cream);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;display:none;max-width:90vw;text-align:center}
#toast.err{background:var(--bad);color:#fff}
.subnav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding:2px 2px 6px}
.subnav .chip{white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:600}
.stats span{font-size:.72rem;color:var(--muted)}
.hero{text-align:center;padding:28px 0 8px}
.hero img{width:150px;border-radius:50%;margin-bottom:12px;box-shadow:0 8px 20px -8px var(--sh)}
.person{border:1px dashed var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.center{text-align:center}
.mt{margin-top:12px}
.modal .in.wide{max-width:520px}
.pz h2{font-size:1.3rem}
.pzbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;margin:12px 0;font-size:.9rem;color:var(--muted)}
.pzbar b{color:var(--cream);font-family:var(--display);font-size:1.1rem;font-weight:600}
.pzboard{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;width:100%;aspect-ratio:1;background:var(--well);padding:3px;border-radius:14px;box-shadow:inset 0 2px 6px var(--sh);margin-bottom:10px}
.pzp{padding:0;min-height:0;border:0;border-radius:6px;background-size:calc(var(--n)*100%) calc(var(--n)*100%);background-color:#121110;box-shadow:0 2px 0 rgba(0,0,0,.35);aspect-ratio:1;width:100%;transition:transform .12s ease,outline-color .12s}
.pzp:active{transform:scale(.96)}
.pzp.sel{outline:3px solid #E0B84F;outline-offset:-3px;transform:scale(.94)}
.pzp.ok{box-shadow:none;cursor:default}
.pzboard.solved{gap:0}.pzboard.solved .pzp{border-radius:0}
.pzmodes{margin-top:10px}.pzmodes .chip{font-size:.8rem;padding:6px 11px}
.pzwrap{display:flex;justify-content:center}
.pzboard.abs{display:block;position:relative}
.pzboard.abs .pzp{position:absolute;left:3px;top:3px;width:calc((100% - 6px)/var(--n));height:calc((100% - 6px)/var(--n));border-radius:4px;border:1px solid rgba(0,0,0,.35);transition:transform .16s ease,opacity .4s}
.pzboard.abs .pzp.sel{outline:3px solid #E0B84F;outline-offset:-3px}
.pzp.rot{transition:transform .2s ease}
.pzcards{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:8px;width:100%}
.pzcard{position:relative;aspect-ratio:1;padding:0;min-height:0;border:0;background:none;box-shadow:none;perspective:600px}
.pzcard span{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;transition:transform .35s ease;box-shadow:0 3px 0 var(--edge),0 8px 14px -8px var(--sh)}
.pzcard .back{background:linear-gradient(145deg,#262421,#0B0B0A);display:flex;align-items:center;justify-content:center}
.pzcard .back img{width:60%;border-radius:50%;opacity:.85}
.pzcard .face{transform:rotateY(180deg);background-color:#121110}
.pzcard.up .back{transform:rotateY(180deg)}.pzcard.up .face{transform:rotateY(0)}
.pzcard.ok .face{box-shadow:0 0 0 3px #7BC47F}
.pzjig{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.pzframe{position:absolute;left:0;top:0;border-radius:6px;background:var(--well);box-shadow:inset 0 2px 6px var(--sh);overflow:hidden}
.pzframe img{width:100%;height:100%;display:block;filter:grayscale(.3)}
.pzpiece{position:absolute;cursor:grab;transition:transform .15s ease;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45));touch-action:none}
.pzpiece.drag{cursor:grabbing;transition:none;filter:drop-shadow(0 10px 12px rgba(0,0,0,.5))}
.pzpiece.ok{filter:none;cursor:default}
.pzwrap.solved .pzframe img{opacity:1!important;filter:none}
.pzwrap.solved .pzp{border-radius:0;border-color:transparent}
.switch{position:relative;display:inline-block;width:52px;height:30px;flex:none;margin:0}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:15px;background:var(--well);border:1px solid var(--line);box-shadow:inset 0 2px 4px var(--sh);transition:background .15s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:linear-gradient(180deg,var(--f1),var(--f2));box-shadow:0 2px 0 var(--edge),0 3px 6px -2px var(--sh);transition:transform .15s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(22px)}
.switch input:focus-visible+span{outline:3px solid var(--cream);outline-offset:2px}
.modal .in.game{padding:14px}
.gmstage{position:relative;border-radius:14px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;margin-top:12px;background:#1d1c1a}
.gmstage canvas{display:block;touch-action:none}
.gmover{position:absolute;inset:0;background:rgba(14,13,12,.7);display:flex;align-items:center;justify-content:center;padding:14px}
.gmover[hidden]{display:none}
.gmcard{background:var(--card);border-radius:18px;padding:16px;width:100%;max-width:320px;text-align:center;max-height:100%;overflow:auto}
.gmcard td{border-color:var(--line)}
.pzday{display:flex;gap:14px;align-items:center}
.pzday img,.pzlogo{background:#fff;border-radius:14px;border:1px solid var(--line)}
.pzday img{width:76px;height:76px;object-fit:contain;padding:4px;flex:none}
.pzlogo{padding:0;overflow:hidden;margin:14px auto 8px;max-width:240px}
.pzlogo img{width:100%;max-height:160px;object-fit:contain;display:block}
table{width:100%;border-collapse:collapse;font-size:.88rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
</style>
</head>
<body>
<div id="app"><div class="wrap hero"><img src="escudo.jpg" alt=""><p class="muted">Cargando…</p></div></div>
<div id="toast"></div>
<button id="themebtn" type="button" aria-label="Cambiar entre modo claro y oscuro" onclick="toggleTheme()"></button>
<script>
'use strict';
const CFG = window.QT_CONFIG;
const sb = supabase.createClient(CFG.url, CFG.key, {auth:{storageKey:'carnet-quinta'}});
const APP_URL = location.origin + location.pathname;
const $ = s => document.querySelector(s);
const app = $('#app');
const S = {user:null, cards:[], cur:null, teams:[], admin:false, tab:'carnet', atab:'resumen', settings:{}};

/* ---------- utilidades ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, err){const t=$('#toast');t.textContent=msg;t.className=err?'err':'';t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3500)}
async function rpc(fn, args){const {data,error}=await sb.rpc(fn,args||{}); if(error) throw new Error(cleanErr(error.message)); return data}
function cleanErr(m){return (m||'Error').replace(/^.*?ERROR:\s*/,'')}
async function guard(fn){try{return await fn()}catch(e){toast(e.message||String(e),true)}}
const fmtDate = d => new Date(d).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short',timeZone:'Europe/Madrid'});
const fmtTime = d => new Date(d).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Madrid'});
const fmtDay = d => d ? new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}) : '';
function qrImg(text, cell){const q=qrcode(0,'M');q.addData(text);q.make();return q.createDataURL(cell||6,2)}
const cur = () => S.cards.find(c => c.id === S.cur) || S.cards[0];
const statusTxt = s => ({activo:'ACTIVO',pendiente:'PENDIENTE DE PAGO',caducado:'CADUCADO',baja:'BAJA'}[s]||s);
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="in">'+html+'</div>';m.addEventListener('click',e=>{if(e.target===m)closeModal()});document.body.appendChild(m);return m}
function closeModal(){stopScan();document.querySelectorAll('.modal').forEach(m=>m.remove())}

const svg = (k, w) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||1.75}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICO[k]}"/></svg>`;
function paintTheme(){
  const dark = document.documentElement.dataset.theme === 'dark';
  const b = $('#themebtn'); if(b) b.innerHTML = svg(dark ? 'sol' : 'luna', 1.9);
  const m = document.querySelector('meta[name=theme-color]'); if(m) m.content = dark ? '#0E0D0C' : '#EEE7D6';
}
function toggleTheme(){
  const dark = document.documentElement.dataset.theme !== 'dark';
  if(dark) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
  lsSet('qt_theme', dark ? 'dark' : 'light'); paintTheme();
}

/* ---------- arranque ---------- */
async function boot(){
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  const hash = location.hash;
  if(hash.startsWith('#comercio')) return renderMerchantSignup();
  const m = hash.match(/[#&]([cp])=([0-9a-f]+)/i);
  if(m) ssSet('qt_code', m[1]+':'+m[2]);
  const st = hash.match(/^#(gol|calendario|aficionado|ruleta|navidad|loteria)$/); if(st) ssSet('qt_story', st[1]);
  if(hash==='#gestion') ssSet('qt_tab','admin');
  const inv = hash.match(/^#invita-(\d+)$/); if(inv) lsSet('qt_ref', inv[1]);
  const gf = hash.match(/^#regalo-([0-9a-f]+)$/); if(gf) ssSet('qt_gift', gf[1]);
  if(hash) history.replaceState(null,'',location.pathname);
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return renderLogin();
  S.user = session.user;
  await afterLogin();
}
function ssSet(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}
function ssGet(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
function ssDel(k){try{sessionStorage.removeItem(k)}catch(e){}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
async function afterLogin(){
  const g = ssGet('qt_gift');
  if(g){ssDel('qt_gift'); try{const r=await rpc('claim_gift',{p_code:g}); S.cur=r.id; S.giftOpened=true}catch(e){toast(e.message,true)}}
  await loadAll();
  const story = ssGet('qt_story');
  if(story && S.cards.length){ssDel('qt_story'); modal(storyHTML(story)+'<button class="full mt" onclick="closeModal()">Ir a mi carnet</button>')}
  if(S.giftOpened){S.giftOpened=false; const c=cur(); modal(`<div class="center"><img src="escudo.jpg" style="width:110px;border-radius:50%"><h2>¡Bienvenido a la Quinta, ${esc(c.first_name)}!</h2><p>Este carnet es un regalo. Ya eres socio nº ${c.member_no}.</p><p class="muted small">Elige en «Partidos» los equipos que quieres seguir.</p><button class="full" onclick="closeModal()">Ver mi carnet</button></div>`)}
}

function storyHTML(k){const s=STORIES[k]; if(!s) return '';
  return `<div class="box"><h2>${esc(s.t)}</h2>${s.p.map(x=>`<p>${esc(x)}</p>`).join('')}<p><b>${esc(s.c)}</b></p></div>`}
async function loadAll(){
  const [teams, cards, admin, sets] = await Promise.all([
    sb.from('teams').select('id,name,category,is_flagship,sort,active').eq('active',true).order('sort').order('name'),
    rpc('my_cards'), rpc('is_admin'), sb.from('settings').select('key,value')
  ]);
  S.teams = teams.data || []; S.cards = cards || []; S.admin = !!admin;
  S.settings = Object.fromEntries((sets.data||[]).map(r=>[r.key,r.value]));
  if(!S.cards.find(c=>c.id===S.cur)) S.cur = (S.cards[0]||{}).id;
  if(S.admin && ssGet('qt_tab')==='admin'){ssDel('qt_tab'); S.tab='admin'}
  if(!S.cards.length && !S.admin) return renderAlta();
  if(!S.cards.length && S.admin && S.tab!=='admin') S.tab='admin';
  render();
  const code = sessionStorage.getItem('qt_code');
  if(code && cur()){sessionStorage.removeItem('qt_code'); doScan(code)}
}

/* ---------- login por código al email ---------- */
function renderLogin(){
  const story = ssGet('qt_story'), gift = ssGet('qt_gift');
  app.innerHTML = `<div class="wrap"><div class="hero"><img src="escudo.jpg" alt="Escudo"><h1>Carnet de socio</h1><p class="muted">Quinta de Tui Futsal</p></div>
  ${story?storyHTML(story):''}<div id="giftintro"></div>
  <div class="box"><h2>${gift?'Abre tu carnet':'Entra o hazte socio'}</h2><p class="muted small">Te mandamos un código a tu email. Sin contraseñas.</p>
  <label>Tu email</label><input id="em" type="email" autocomplete="email" inputmode="email" placeholder="tu@email.com">
  <button class="full mt" id="b1">Enviarme el código</button>
  <div id="step2" style="display:none"><label>Código que te ha llegado</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="123456">
  <button class="full mt" id="b2">Entrar</button><p class="muted small">¿No te llega? Mira en spam o promociones.</p></div></div>
  <p class="center"><a class="muted small" href="#comercio" onclick="setTimeout(boot)">¿Tienes un comercio? Únete al carnet</a></p></div>`;
  $('#b1').onclick = () => guard(async()=>{
    const email=$('#em').value.trim().toLowerCase(); if(!/^\S+@\S+\.\S+$/.test(email)) throw new Error('Revisa el email');
    $('#b1').disabled=true;
    const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});
    $('#b1').disabled=false; if(error) throw new Error(error.message);
    $('#step2').style.display='block'; $('#b1').textContent='Reenviar código'; $('#otp').focus(); toast('Código enviado');
  });
  $('#b2').onclick = () => guard(async()=>{
    const {data,error}=await sb.auth.verifyOtp({email:$('#em').value.trim().toLowerCase(),token:$('#otp').value.trim(),type:'email'});
    if(error) throw new Error('Código incorrecto o caducado');
    S.user=data.user; await afterLogin();
  });
  if(gift) rpc('gift_info',{p_code:gift}).then(g=>{ if(g) $('#giftintro').innerHTML=`<div class="banner ok"><b>${esc(g.first_name)}, te han regalado el carnet de socio de la Quinta.</b><br>Entra con tu email para abrirlo. No tienes que rellenar nada más.</div>`}).catch(()=>{});
}

/* ---------- alta de socios ---------- */
let altaPeople = [];
async function renderAlta(extra){
  const prefill = extra ? [] : await rpc('clubber_prefill').catch(()=>[]);
  const pr = S.settings.precios || {individual:12,familiar:6,protector:[30,50]};
  if(!altaPeople.length){
    altaPeople = prefill.length ? prefill.map(p=>({first_name:p.first_name||'',last_name:p.last_name||'',birth_date:p.birth_date||'',relation:'jugador',teams:S.teams.filter(t=>p.team_name&&t.name.toLowerCase()===p.team_name.toLowerCase()).map(t=>t.id)}))
                                : [{first_name:'',last_name:'',birth_date:'',relation:'familiar',teams:[]}];
  }
  const hasCards = S.cards.length>0;
  const story = ssGet('qt_story');
  app.innerHTML = `<div class="wrap"><div class="hero" style="padding-top:8px"><img src="escudo.jpg" style="width:90px"><h1>${hasCards?'Añadir carnets':'Hazte socio'}</h1></div>
  ${story&&!hasCards?storyHTML(story):''}
  ${prefill.length?`<div class="banner ok">Ya te teníamos en el club: hemos rellenado tus datos. Revísalos y confirma.</div>`:''}
  <div class="box"><p class="muted small">Un carnet por persona. ${hasCards?'Cada carnet más de tu familia cuesta '+pr.familiar+' €.':'El primero cuesta '+pr.individual+' € al año y cada uno más de tu familia, '+pr.familiar+' €.'} Si es menor de 14 años, el alta la hace su padre o su madre.</p>
  <div id="people"></div><button class="sec full" id="addp">+ Añadir otra persona de la familia</button></div>
  ${hasCards?'':`<div class="box"><h3>Socio protector (opcional)</h3><p class="muted small">Si quieres ayudar más al club, tu carnet puede ser de protector. Saldrás en el muro de agradecimiento.</p>
  <div class="chips" id="prot"><button class="chip on" data-v="">Normal</button>${(pr.protector||[]).map(v=>`<button class="chip" data-v="${v}">Protector ${v} €</button>`).join('')}</div></div>`}
  <div class="box">${hasCards?'':`<label>¿Te ha invitado un socio? Su número de socio</label><input id="ref" inputmode="numeric" value="${esc(lsGet('qt_ref')||'')}" placeholder="Opcional">`}
  <label>Tu teléfono móvil</label><input id="tel" type="tel" inputmode="tel" placeholder="600 000 000" value="${esc((prefill[0]||{}).phone||'')}">
  <div class="chk"><input type="checkbox" id="cc"><span>Quiero recibir noticias, avisos y ventajas del club por email y en la app.</span></div>
  <div class="chk"><input type="checkbox" id="pp"><span>He leído y acepto el tratamiento de mis datos por Quinta de Tui Futsal para gestionar el carnet de socio.</span></div>
  <div id="total" class="big mt"></div>
  <button class="full mt" id="go">Confirmar alta</button>
  ${hasCards?'<button class="link full" onclick="altaPeople=[];render()">Cancelar</button>':'<button class="link full" onclick="logout()">Salir</button>'}</div></div>`;
  let protector = '';
  const draw = () => {
    $('#people').innerHTML = altaPeople.map((p,i)=>`<div class="person"><div class="row"><b>Persona ${i+1}</b>${altaPeople.length>1?`<button class="link" style="flex:0" onclick="altaPeople.splice(${i},1);renderAltaKeep()">Quitar</button>`:''}</div>
      <div class="grid2"><div><label>Nombre</label><input data-i="${i}" data-k="first_name" value="${esc(p.first_name)}"></div><div><label>Apellidos</label><input data-i="${i}" data-k="last_name" value="${esc(p.last_name)}"></div></div>
      <div class="grid2"><div><label>Fecha de nacimiento</label><input type="date" data-i="${i}" data-k="birth_date" value="${esc(p.birth_date)}"></div>
      <div><label>Relación con el club</label><select data-i="${i}" data-k="relation">${['jugador','familiar','aficionado'].map(r=>`<option ${p.relation===r?'selected':''}>${r}</option>`).join('')}</select></div></div>
      <div class="chk"><input type="checkbox" data-i="${i}" data-k="gift" ${p.gift?'checked':''}><span>Es un regalo para otra persona. Te damos una tarjeta regalo para imprimir y su carnet se abre con un QR.</span></div>
      <label>Equipos que sigue</label><div class="chips">${S.teams.map(t=>`<button class="chip ${p.teams.includes(t.id)?'on':''}" data-i="${i}" data-t="${t.id}">${esc(t.name)}</button>`).join('')||'<span class="muted small">Aún no hay equipos cargados</span>'}</div></div>`).join('');
    $('#people').querySelectorAll('input,select').forEach(el=>el.oninput=()=>{altaPeople[+el.dataset.i][el.dataset.k]=el.type==='checkbox'?el.checked:el.value});
    $('#people').querySelectorAll('[data-t]').forEach(el=>el.onclick=()=>{const p=altaPeople[+el.dataset.i],t=+el.dataset.t;p.teams=p.teams.includes(t)?p.teams.filter(x=>x!==t):[...p.teams,t];draw()});
    const n=altaPeople.length; const first = hasCards?pr.familiar:(protector?+protector:pr.individual);
    $('#total').textContent = (first + (n-1)*pr.familiar) + ' € / año';
  };
  window.renderAltaKeep = draw;
  draw();
  $('#addp').onclick = () => {altaPeople.push({first_name:'',last_name:(altaPeople[0]||{}).last_name||'',birth_date:'',relation:'jugador',teams:[]});draw()};
  if($('#prot')) $('#prot').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{protector=b.dataset.v;$('#prot').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));draw()});
  $('#go').onclick = () => guard(async()=>{
    if(!$('#pp').checked) throw new Error('Tienes que aceptar el tratamiento de datos');
    const phone=$('#tel').value.trim();
    const items = altaPeople.map(p=>({...p,phone}));
    $('#go').disabled=true;
    const ref = $('#ref') && $('#ref').value.trim() ? +$('#ref').value.trim() : null;
    try{ await rpc('register_members',{p_items:items.map(p=>p.gift?{...p,phone:''}:p),p_consent:$('#cc').checked,p_protector:protector?+protector:null,p_referral:ref}); }
    finally{ $('#go').disabled=false }
    const gifts = items.some(p=>p.gift); altaPeople=[]; ssDel('qt_story'); S.tab='carnet'; await loadAll();
    toast(gifts?'¡Alta hecha! La tarjeta regalo la tienes en el carnet del regalado.':'¡Alta hecha!');
  });
}

/* ---------- estructura principal ---------- */
function render(){
  const c = cur();
  const tabs = [['carnet','Carnet'],['partidos','Partidos'],['juegos','Juegos'],['comercios','Comercios'],['puntos','Puntos']];
  if(S.admin) tabs.push(['admin','Gestión']);
  app.innerHTML = `<div class="top"><img src="escudo.jpg" alt=""><div class="t">QUINTA DE TUI<br><span class="muted small">Carnet de socio</span></div>
    ${S.cards.length>1?`<select id="sel">${S.cards.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.first_name)}</option>`).join('')}</select>`:''}</div>
    <div class="wrap" id="main"></div>
    <nav class="nav" aria-label="Secciones">${tabs.map(t=>`<button class="${S.tab===t[0]?'on':''}" data-tab="${t[0]}" ${S.tab===t[0]?'aria-current="page"':''}><span class="pill">${svg(t[0])}</span>${t[1]}</button>`).join('')}</nav>`;
  if($('#sel')) $('#sel').onchange = e => {S.cur=e.target.value; render()};
  document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();scrollTo(0,0)});
  const v = {carnet:viewCarnet,partidos:viewPartidos,juegos:viewJuegos,comercios:viewComercios,puntos:viewPuntos,admin:viewAdmin}[S.tab];
  if(!c && S.tab!=='admin') return viewNoCard();
  guard(()=>v($('#main'), c));
}
function viewNoCard(){ $('#main').innerHTML=`<div class="box center"><p>Todavía no tienes carnet.</p><button onclick="renderAlta()">Hacerme socio</button></div>` }

let scanStream=null, scanRAF=null;
function openScanner(){
  const c=cur(); if(c.status!=='activo') return toast('Tu carnet tiene que estar activo para sumar puntos',true);
  modal(`<h2>Escanear QR</h2><video id="vid" playsinline muted></video><canvas id="cv" style="display:none"></canvas>
   <p class="muted small">Apunta al QR del mostrador o del cartel del partido.</p>
   <label>¿No funciona la cámara? Escribe el código</label><div class="row"><input id="manual" placeholder="código"><button style="flex:0" onclick="manualScan()">OK</button></div>
   <button class="sec full mt" onclick="closeModal()">Cerrar</button>`);
  navigator.mediaDevices?.getUserMedia({video:{facingMode:'environment'}}).then(st=>{
    scanStream=st; const v=$('#vid'); if(!v) return stopScan(); v.srcObject=st; v.play();
    const cv=$('#cv'), ctx=cv.getContext('2d',{willReadFrequently:true});
    const tick=()=>{ if(!scanStream) return;
      if(v.readyState===v.HAVE_ENOUGH_DATA){cv.width=v.videoWidth;cv.height=v.videoHeight;ctx.drawImage(v,0,0);
        const r=jsQR(ctx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);
        if(r&&r.data){const m=r.data.match(/[#?&]([cp])=([0-9a-f]+)/i); if(m){closeModal();return doScan(m[1]+':'+m[2])}}}
      scanRAF=requestAnimationFrame(tick)};
    tick();
  }).catch(()=>toast('No se pudo abrir la cámara. Escribe el código.',true));
}
function stopScan(){if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}cancelAnimationFrame(scanRAF)}
function manualScan(){const v=$('#manual').value.trim();closeModal();doScan(v.includes(':')?v:'c:'+v)}

  const c=cur(); if(!c) return;
  guard(async()=>{const r=await rpc('scan_code',{p_member:c.id,p_code:code});

const PATROCINADORES = [
  ['persa','Concepto by Persa Cociñas',1],['seta','S.E.T.A.',1],['mensatui','MensaTui Logística',1],
  ['casapote','Restaurante Casa Pote',2],['marangel','Marangel',2],['alipa','Estudio Alipa Cociñas',2],['inglesinos','Academia Inglesiños',2],
  ['cluber','Cluber',2],['a3','a3 arquitectura',2],['blancoquintas','Blanco Quintas',2],['maderas','Maderas Porriño',2],
  ['cal','CAL Construcciones y Servicios',3],['dizgamallo','Gestoría Diz Gamallo',3],['life','LIFe',3],
  ['nobel','Espacio Lector Nobel',3],['ponyexpress','Pony Express',3],['concellotui','Concello de Tui',3,1],['deputacion','Deputación de Pontevedra',3,1],['xunta','Xunta de Galicia',3,1]
].map(([id,name,tier,inst])=>({id,name,tier,inst:!!inst,logo:'patrocinadores/color/'+id+(id==='nobel'?'.png':'.jpg')}));
function puzzleItems(){ return PATROCINADORES; }
function madridDayNo(){ const d=new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Madrid'}); return Math.floor(Date.parse(d+'T00:00:00Z')/864e5); }
function puzzleOfDay(){
  const items=puzzleItems(), rot=[];
  items.forEach(it=>{ for(let k=0;k<(it.tier===1?3:it.tier===2?2:1);k++) rot.push(it); });
  let seed=20261117; const rnd=()=>(seed=(seed*1103515245+12345)%2147483648)/2147483648;
  for(let i=rot.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[rot[i],rot[j]]=[rot[j],rot[i]];}
  return rot[madridDayNo()%rot.length];
}
const imgCache={};
function loadImg(src){ return imgCache[src] || (imgCache[src]=new Promise((ok,ko)=>{const i=new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=src;})); }
/* La imagen del puzle: fondo con luz y escudo de marca de agua (para que cada pieza sea distinta), logo y nombre */
async function puzzleImage(it){
  const S2=720, cv=document.createElement('canvas'); cv.width=cv.height=S2; const c=cv.getContext('2d');
  const g=c.createLinearGradient(0,0,S2,S2); g.addColorStop(0,'#4A3520'); g.addColorStop(.48,'#121110'); g.addColorStop(1,'#22313A');
  c.fillStyle=g; c.fillRect(0,0,S2,S2);
  c.save(); c.globalAlpha=.07; c.fillStyle='#F1EAD8';
  for(let k=-2;k<7;k++){ c.beginPath(); c.moveTo(k*150,0); c.lineTo(k*150+70,0); c.lineTo(k*150-290,S2); c.lineTo(k*150-360,S2); c.fill(); }
  c.restore();
  try{ const e=await loadImg('escudo.jpg'); c.save(); c.globalAlpha=.12; c.beginPath(); c.arc(S2*.8,S2*.82,S2*.42,0,7); c.clip(); c.drawImage(e,S2*.38,S2*.4,S2*.84,S2*.84); c.restore(); }catch(e){}
  const rg=c.createRadialGradient(S2/2,S2*.42,20,S2/2,S2*.42,S2*.42); rg.addColorStop(0,'rgba(255,240,210,.16)'); rg.addColorStop(1,'rgba(255,240,210,0)');
  c.fillStyle=rg; c.fillRect(0,0,S2,S2);
  c.strokeStyle='rgba(241,234,216,.55)'; c.lineWidth=4; c.strokeRect(18,18,S2-36,S2-36);
  const L=await loadImg(it.logo); const s=Math.min(S2*.74/L.width, S2*.54/L.height, S2*.72/Math.sqrt(L.width*L.height));

  g.fillStyle='#1d1c1a'; g.fillRect(0,0,W,H); g.fillStyle='#fff'; g.font='600 16px Barlow, sans-serif'; g.textAlign='center'; g.fillText('Cargando…',W/2,H/2);
  Promise.all([adLogos(), gameSprites()]).then(([logos,spr]) => (game==='penaltis'?gamePenaltis:gameToques)(g, cv, W, H, logos, spr, (score,secs)=>gameEnd(game,score,secs)));
}

/* Penaltis: cinco tiros contra un portero que cada vez acierta más */
function gamePenaltis(g, cv, W, H, logos, spr, end){
  const s=W/941, offY=Math.min(0, H-(1345-60)*s), f=y=>(y-60)*s+offY;
  const gx=98*s, gw=744*s, gt=f(357), gb=f(809), gh=gb-gt, pw=26*s, bx0=W/2, by0=Math.min(f(1275), H-W*.11), br=W*.07;
  const kImg=spr.portero, kh=430*s, kwImg=kImg?kh*kImg.width/kImg.height:kh*.86, kw=kwImg*.55;
  let kx=W/2, kdir=1;
  let shot=0, goals=0, res=[], phase='aim', t0=0, start=null, fl=null, msg='', msgT=0, off=0, last=performance.now(), drag=null, trail=[];
  const ball={x:bx0,y:by0,r:br,rot:0};
  const scene=()=>{
    if(spr.fondoPen){ g.drawImage(spr.fondoPen, 0, offY, W, spr.fondoPen.height*W/spr.fondoPen.width); } else { g.fillStyle='#1d1c1a'; g.fillRect(0,0,W,H); }
    drawBoards(g,0,f(597),W,f(720)-f(597),logos,off);
    g.fillStyle='rgba(255,255,255,.95)'; g.beginPath(); g.ellipse(bx0,by0+br*.95,br*.9,br*.28,0,0,7); g.fill();
  };
  const net=()=>{ g.save(); g.beginPath(); g.rect(gx,gt,gw,gh); g.clip(); g.fillStyle='rgba(255,255,255,.06)'; g.fillRect(gx,gt,gw,gh);
    g.strokeStyle='rgba(255,255,255,.8)'; g.lineWidth=Math.max(1,2.2*s*1.4);
    const step=27*s*1.15; for(let x=gx; x<=gx+gw; x+=step){ g.beginPath(); g.moveTo(x,gt); g.lineTo(x,gb); g.stroke(); }
    for(let y=gt; y<=gb; y+=step){ g.beginPath(); g.moveTo(gx,y); g.lineTo(gx+gw,y); g.stroke(); } g.restore(); };
  const posts=()=>{ const seg=gh/6; g.fillStyle='#f4f1ea'; g.fillRect(gx-pw,gt-pw,pw,gh+pw); g.fillRect(gx+gw,gt-pw,pw,gh+pw); g.fillRect(gx-pw,gt-pw,gw+2*pw,pw);
    g.fillStyle='#d32f2f'; for(let i=0;i<6;i+=2){ g.fillRect(gx-pw,gt+i*seg,pw,seg); g.fillRect(gx+gw,gt+i*seg,pw,seg); }
    const sx=gw/10; for(let i=0;i<10;i+=2) g.fillRect(gx+i*sx,gt-pw,sx,pw);
    g.fillStyle='rgba(0,0,0,.18)'; g.fillRect(gx-pw*.35,gt,pw*.35,gh); g.fillRect(gx+gw+pw*.65,gt,pw*.35,gh); };
  const keeper=(x,ang,lift)=>{ g.save(); g.translate(x, gb-lift); g.rotate(ang);
    g.fillStyle='rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(0,0,kwImg*.42,kwImg*.08,0,0,7); g.fill();
    if(kImg) g.drawImage(kImg,-kwImg/2,-kh,kwImg,kh); else { g.fillStyle='#6a2fb5'; g.fillRect(-kw/2,-kh*.8,kw,kh*.5); }
    g.restore(); };
  const hud=()=>{ g.fillStyle='rgba(0,0,0,.45)'; if(g.roundRect){ g.beginPath(); g.roundRect(6,6,140,26,13); g.fill(); } else g.fillRect(6,6,140,26);
    for(let i=0;i<5;i++){ const x=21+i*24, y=19; g.beginPath(); g.arc(x,y,8,0,7);
      if(res[i]==='GOL'){ g.fillStyle='#4caf6e'; g.fill(); } else if(res[i]){ g.fillStyle='#d9534f'; g.fill(); } else { g.strokeStyle='rgba(255,255,255,.8)'; g.lineWidth=2; g.stroke(); } }
    g.fillStyle='#fff'; g.font='600 18px Oswald, sans-serif'; g.textAlign='right'; g.shadowColor='rgba(0,0,0,.7)'; g.shadowBlur=6; g.fillText(`Goles ${goals}`, W-12, 25); g.shadowBlur=0; };
  const shoot=(dx,dy,dt)=>{
    const v=Math.hypot(dx,dy)/Math.max(dt,16), hr=Math.max(0,Math.min(1.3,(v-.45)/1.5));
    const ty=gb-br*.8-hr*gh, tx=bx0+(dx/(-dy))*(by0-ty)*.9;
    let out='GOL', saved=false; const rr=br*.45;
    const nearPost=(Math.abs(tx-gx)<rr+pw*.5||Math.abs(tx-(gx+gw))<rr+pw*.5)&&ty>gt-rr, nearBar=Math.abs(ty-gt)<rr+pw*.5&&tx>gx&&tx<gx+gw;
    if(nearPost||nearBar) out='¡AL PALO!'; else if(tx<gx||tx>gx+gw||ty<gt) out='FUERA';
    let dive=kx, ang=0, lift=0;
    if(out==='GOL'){
      const p=.35+.07*shot, reach=gw*.3, high=(gb-ty)/gh>.7, corner=Math.abs(tx-W/2)>gw*.36;
      const guess=Math.random()<p ? tx : kx+(Math.random()<.5?-1:1)*gw*.3;
      dive=Math.max(kx-reach,Math.min(kx+reach,guess)); dive=Math.max(gx+kwImg*.3,Math.min(gx+gw-kwImg*.3,dive)); const side=Math.sign(dive-kx)||1;
      ang=side*Math.min(1.2,Math.abs(dive-kx)/reach*1.2); lift=Math.min(gh*.4,(gb-ty)*.5);
      saved=Math.abs(dive-tx)<kw*.95*(high&&corner?.6:1) && !(high&&corner&&Math.random()<.45);
      if(saved) out='¡PARADA!';
    } else { dive=kx+(Math.random()<.5?-1:1)*gw*.22; ang=Math.sign(dive-kx)*.8; lift=gh*.12; }
    fl={tx,ty,out,dive,ang,lift,k0:kx}; phase='fly'; t0=performance.now();
  };
  const loop=now=>{
    if(!document.body.contains(cv)) return; const dt=Math.min(.05,(now-last)/1000); last=now; off+=dt*28;
    if(phase==='aim'){ kx+=kdir*gw*(.22+.07*shot)*dt; if(kx>gx+gw*.66){kx=gx+gw*.66;kdir=-1} if(kx<gx+gw*.34){kx=gx+gw*.34;kdir=1} }
    scene(); net();
    let kxd=kx, ka=0, kl=0;
    if(phase==='fly'||phase==='res'){
      const t=Math.min(1,(now-t0)/520), e=1-Math.pow(1-t,2), kt=Math.min(1,t*1.3);
      kxd=fl.k0+(fl.dive-fl.k0)*kt; ka=fl.ang*kt; kl=fl.lift*kt;
      if(phase==='fly'){ ball.x=bx0+(fl.tx-bx0)*e; ball.y=by0+(fl.ty-by0)*e-Math.sin(t*Math.PI)*gh*.12; ball.r=br*(1-.55*e); ball.rot+=.3;
        if(t>=1){ phase='res'; msg=fl.out; msgT=now; res.push(fl.out==='GOL'?'GOL':'X'); if(fl.out==='GOL') goals++;
          if(fl.out!=='GOL'){ fl.bx=(fl.out==='FUERA'?0:(Math.random()<.5?-1:1)); } } }
      else if(fl.out!=='GOL'){ ball.y+=(fl.out==='FUERA'?-40:120)*dt; ball.x+=fl.bx*90*dt; }
    }
    const inGoal = phase==='res' && fl && fl.out==='GOL';
    if(inGoal){ drawBallImg(g,spr.balon,ball.x,ball.y,ball.r,ball.rot); net(); }
    posts(); keeper(kxd,ka,kl);
    if(!inGoal) drawBallImg(g,spr.balon,ball.x,ball.y,ball.r,ball.rot);
    if(drag&&trail.length>1){ g.strokeStyle='rgba(255,255,255,.6)'; g.lineWidth=5; g.lineCap='round'; g.beginPath(); trail.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)); g.stroke(); }
    hud();
    if(phase==='aim'&&shot===0&&!drag){ g.fillStyle='#fff'; g.font='600 16px Barlow, sans-serif'; g.textAlign='center'; g.shadowColor='rgba(0,0,0,.8)'; g.shadowBlur=8; g.fillText('Desliza desde el balón hacia la portería', W/2, by0-br*1.8); g.shadowBlur=0; }
    if(phase==='res'){ const k=Math.min(1,(now-msgT)/250); g.save(); g.globalAlpha=k; g.fillStyle=msg==='GOL'?'#E0B84F':'#fff'; g.font=`700 ${Math.round(W*.13)}px Oswald, sans-serif`; g.textAlign='center';
      g.shadowColor='rgba(0,0,0,.75)'; g.shadowBlur=14; g.fillText(msg==='GOL'?'¡GOOOL!':msg, W/2, gb+(by0-gb)*.5); g.restore();
      if(now-msgT>1100){ shot++; if(shot>=5){ phase='end'; end(goals, Math.round((now-start)/1000)); return; } phase='aim'; ball.x=bx0; ball.y=by0; ball.r=br; fl=null; } }
    requestAnimationFrame(loop);
  };
  const P=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top, t:performance.now()}; };
  cv.addEventListener('pointerdown',e=>{ if(phase!=='aim') return; const p=P(e); if(Math.hypot(p.x-bx0,p.y-by0)>br*3) return; e.preventDefault(); cv.setPointerCapture(e.pointerId); drag=p; trail=[p]; if(!start) start=performance.now(); });
  cv.addEventListener('pointermove',e=>{ if(drag){ trail.push(P(e)); if(trail.length>12) trail.shift(); } });
  cv.addEventListener('pointerup',e=>{ if(!drag) return; const p=P(e); const dx=p.x-drag.x, dy=p.y-drag.y; const recent=trail.length>3?trail[Math.max(0,trail.length-6)]:drag;
    const dt=Math.max(16,p.t-recent.t), dist=Math.hypot(p.x-recent.x,p.y-recent.y); drag=null; trail=[];
    if(dy>-25) return; shoot(dx, dy, dt*Math.hypot(dx,dy)/Math.max(dist,1)); });
  requestAnimationFrame(loop);
}

/* Toques: el jugador de A Quinta va debajo del balón; con 12 toques sale otro balón y con 35 el tercero */
function gameToques(g, cv, W, H, logos, spr, end){
  const s=W/941, offY=H-(1500-230)*s, f=y=>(y-230)*s+offY;
  const floor=H-H*.04, pImg=spr.jugador, ph=H*.42, pw2=pImg?ph*pImg.width/pImg.height:ph*.66, R=W*.075;
  const foot=pw2*.36;                     // el pie que golpea está a la derecha del centro del dibujo
  let balls=[{x:W/2,y:H*.48,vx:0,vy:0,r:R,rot:0,va:0}], score=0, started=false, over=false, start=0, last=performance.now(), off=0, grav=H*1.2, note='', noteT=0, flash=[];
  let px=W/2-foot, kickT=-1e9;
  const add=()=>{ balls.push({x:W*(.25+Math.random()*.5),y:-R,vx:(Math.random()-.5)*W*.3,vy:H*.1,r:R*.92,rot:0,va:0}); note='¡Otro balón!'; noteT=performance.now(); };
  const scene=()=>{
    if(spr.fondoToq) g.drawImage(spr.fondoToq,0,offY,W,spr.fondoToq.height*W/spr.fondoToq.width); else { g.fillStyle='#2b5d8a'; g.fillRect(0,0,W,H); }
    drawBoards(g,0,f(606),W,f(714)-f(606),logos,off);
  };
  const player=now=>{
    const k=Math.max(0,1-(now-kickT)/220), lift=Math.sin(k*Math.PI)*ph*.05, rot=-k*.12;
    g.fillStyle='rgba(0,0,0,.28)'; g.beginPath(); g.ellipse(px,floor,pw2*.38,pw2*.07,0,0,7); g.fill();
    g.save(); g.translate(px,floor-lift); g.rotate(rot);
    if(pImg) g.drawImage(pImg,-pw2/2,-ph,pw2,ph); else { g.fillStyle='#111'; g.fillRect(-pw2/4,-ph*.7,pw2/2,ph*.5); }
    g.restore();
  };
  const loop=now=>{
    if(!document.body.contains(cv)) return; const dt=Math.min(.033,(now-last)/1000); last=now; off+=dt*30;
    if(started&&!over){ const gk=grav*(1+Math.min(.6,score*.008));
      for(const b of balls){ b.vy+=gk*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; b.rot+=b.va*dt; b.vx*=.995;
        if(b.x-b.r<0){b.x=b.r;b.vx=Math.abs(b.vx)*.8} if(b.x+b.r>W){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.8}
        if(b.y-b.r<0&&b.vy<0){b.y=b.r;b.vy=Math.abs(b.vy)*.4}
        if(b.y+b.r>floor){ over=true; b.y=floor-b.r; } } }
    // el jugador corre a ponerse debajo del balón que va más abajo
    const low=balls.reduce((a,b)=>b.y>a.y?b:a,balls[0]); const target=Math.max(pw2/2,Math.min(W-pw2/2,low.x-foot));
    px+=(target-px)*Math.min(1,dt*6);
    scene(); player(now);
    for(const b of balls) drawBallImg(g,spr.balon,b.x,b.y,b.r,b.rot);
    flash=flash.filter(q=>now-q.t<300); for(const q of flash){ g.strokeStyle=`rgba(224,184,79,${1-(now-q.t)/300})`; g.lineWidth=3; g.beginPath(); g.arc(q.x,q.y,R*(1+(now-q.t)/300),0,7); g.stroke(); }
    g.fillStyle='rgba(0,0,0,.45)'; if(g.roundRect){ g.beginPath(); g.roundRect(8,8,118,30,15); g.fill(); } else g.fillRect(8,8,118,30);
    g.fillStyle='#fff'; g.font='600 20px Oswald, sans-serif'; g.textAlign='left'; g.fillText(`Toques ${score}`,20,30);
    if(!started){ g.textAlign='center'; g.font='600 17px Barlow, sans-serif'; g.shadowColor='rgba(0,0,0,.8)'; g.shadowBlur=8; g.fillText('Toca el balón para empezar', W/2, H*.48-R*1.7); g.shadowBlur=0; }
    if(note&&now-noteT<1400){ g.textAlign='center'; g.fillStyle='#E0B84F'; g.font=`700 ${Math.round(W*.09)}px Oswald, sans-serif`; g.shadowColor='rgba(0,0,0,.7)'; g.shadowBlur=10; g.fillText(note,W/2,H*.16); g.shadowBlur=0; }
    if(over){ g.textAlign='center'; g.fillStyle='#fff'; g.font=`700 ${Math.round(W*.11)}px Oswald, sans-serif`; g.shadowColor='rgba(0,0,0,.7)'; g.shadowBlur=12; g.fillText('¡Al suelo!',W/2,H*.2); g.shadowBlur=0;
      end(score, Math.max(1,Math.round((now-start)/1000))); return; }
    requestAnimationFrame(loop);
  };
  cv.addEventListener('pointerdown',e=>{
    if(over) return; e.preventDefault(); const r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    let best=null, bd=1e9; for(const b of balls){ const d=Math.hypot(x-b.x,y-b.y); if(d<b.r*1.5&&d<bd){bd=d;best=b;} }
    if(!best) return;
    if(!started){ started=true; start=performance.now(); }
    best.vy=-H*(.95+Math.random()*.12); best.vx+=((best.x-x)/best.r)*W*.45+(Math.random()-.5)*W*.12; best.va=(best.x-x)/best.r*8;
    score++; kickT=performance.now(); flash.push({x:best.x,y:best.y,t:performance.now()});
    if(score===12||score===35) add();
  });
  requestAnimationFrame(loop);
}
function wheelSVG(segs){
  const n=segs.length, r=140, a=2*Math.PI/n; let s='';
  segs.forEach((v,i)=>{const a0=i*a-Math.PI/2, a1=a0+a;
    const x0=r+r*Math.cos(a0), y0=r+r*Math.sin(a0), x1=r+r*Math.cos(a1), y1=r+r*Math.sin(a1);
    const am=a0+a/2, tx=r+r*.66*Math.cos(am), ty=r+r*.66*Math.sin(am);
    s+=`<path d="M${r},${r} L${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1} Z" fill="${i%2?'#e8e0cc':'#1c1c1c'}" stroke="#555"/>
        <text x="${tx}" y="${ty}" fill="${i%2?'#0d0d0d':'#e8e0cc'}" font-size="22" font-weight="800" text-anchor="middle" dominant-baseline="middle" transform="rotate(${am*180/Math.PI+90} ${tx} ${ty})">+${v}</text>`});
  return `<svg viewBox="0 0 280 280">${s}<circle cx="140" cy="140" r="26" fill="#0d0d0d" stroke="#e8e0cc" stroke-width="3"/></svg>`;
}

async function aCarteles(b){
  const today=new Date(), d=today.getDay(), mon=new Date(today); mon.setDate(today.getDate()-((d+6)%7)); const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const iso=x=>x.toISOString().slice(0,10);
  b.innerHTML=`<div class="box"><h3>Carteles de asistencia</h3><p class="muted small">Un QR distinto por partido en casa. Solo vale durante el partido y una vez por persona. Imprímelos y pégalos en la puerta del pabellón.</p>
    <div class="grid2"><div><label>Desde</label><input id="cf" type="date" value="${iso(mon)}"></div><div><label>Hasta</label><input id="ct" type="date" value="${iso(sun)}"></div></div>

   <div class="box"><h3>Cartel fijo de alta</h3><p class="muted small">Para plastificar y dejar en la entrada del pabellón. Siempre lleva al alta de socios, no caduca.</p>

  $('#cgo').onclick=()=>guard(async()=>{
    const ms=await rpc('admin_home_matches',{p_from:$('#cf').value,p_to:$('#ct').value});
    if(!ms.length) throw new Error('No hay partidos en casa en esas fechas');
    const pts=S.settings.puntos||{};

}

  const w=window.open('','_blank'); if(!w) return toast('Permite las ventanas emergentes para imprimir',true);

   .p img.e{width:160px;border-radius:50%}.p img.q{width:60vmin;max-width:420px;margin:20px 0}h1{font-size:34px;margin:12px 0 4px}h2{font-size:22px;font-weight:500;margin:0;color:#444}p{font-size:22px;font-weight:700}</style></head><body>

   <div class="box"><h3>Lotería de Navidad</h3><p class="muted small">Con cada alta activada hasta la fecha límite se regala una participación al titular. Solo los socios pueden pedir más.</p>
    <div class="chk"><input type="checkbox" id="la" ${(S.settings.loteria||{}).activa?'checked':''}><span>Lotería activa</span></div>
    <div class="grid2"><div><label>Número</label><input id="ln" value="${esc((S.settings.loteria||{}).numero||'')}"></div><div><label>Importe participación (€)</label><input id="li" type="number" value="${(S.settings.loteria||{}).importe||5}"></div></div>
    <label>Fecha límite</label><input id="lh" type="date" value="${(S.settings.loteria||{}).hasta||''}"><button class="mt" id="lok">Guardar</button></div>
   <div class="box"><h3>Importar socios de Clubber</h3><p class="muted small">Exporta de Clubber un CSV con nombre, apellidos, email, teléfono, fecha de nacimiento y equipo. Cuando esa familia se dé de alta con su email, sus datos aparecerán ya rellenados. Al importar se sustituye la lista anterior.</p>
    <input type="file" id="csv" accept=".csv,text/csv"><div id="cprev" class="muted small mt"></div></div>`;
  $('#pok').onclick=()=>guard(async()=>{const {error}=await sb.from('settings').upsert({key:'pago',value:{texto:$('#pt').value.trim()}});if(error)throw error;S.settings.pago={texto:$('#pt').value.trim()};toast('Guardado')});
  $('#lok').onclick=()=>guard(async()=>{const v={activa:$('#la').checked,numero:$('#ln').value.trim(),importe:+$('#li').value||5,hasta:$('#lh').value};
    const {error}=await sb.from('settings').upsert({key:'loteria',value:v});if(error)throw error;S.settings.loteria=v;toast('Guardado')});
  $('#csv').onchange=e=>{const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>previewCSV(r.result); r.readAsText(f,'utf-8')};
}
function parseCSV(t){
  t=t.replace(/^﻿/,''); const sep=(t.split('\n')[0].match(/;/g)||[]).length>(t.split('\n')[0].match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true; else if(ch===sep){row.push(f);f=''} else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''} else f+=ch}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
function previewCSV(text){
  const rows=parseCSV(text); if(rows.length<2) return toast('El archivo está vacío',true);
  const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const H=rows[0].map(norm); const find=(...k)=>H.findIndex(h=>k.some(x=>h.includes(x)));
  const ix={email:find('email','correo','e-mail'),phone:find('movil','telefono','phone','tlf'),first_name:find('nombre','name'),last_name:find('apellido','surname'),birth:find('nacimiento','birth','fecha nac'),team:find('equipo','team','categoria')};
  if(ix.last_name===ix.first_name) ix.first_name=H.findIndex((h,i)=>h.includes('nombre')&&i!==ix.last_name);
  const date=s=>{s=(s||'').trim();let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:''};
  const g=(r,i)=>i>=0?(r[i]||'').trim():'';
  const data=rows.slice(1).map(r=>({email:g(r,ix.email),phone:g(r,ix.phone),first_name:g(r,ix.first_name),last_name:g(r,ix.last_name),birth_date:date(g(r,ix.birth)),team_name:g(r,ix.team)})).filter(r=>r.email||r.phone);
  const miss=Object.entries(ix).filter(([k,v])=>v<0).map(([k])=>k);
  $('#cprev').innerHTML=`${data.length} personas encontradas.${miss.length?' No encuentro las columnas: '+miss.join(', ')+'.':''}<br>Ejemplo: ${esc(JSON.stringify(data[0]||{}))}<br><button class="mt" id="cimp">Importar ${data.length}</button>`;
  $('#cimp').onclick=()=>guard(async()=>{const n=await rpc('admin_import_clubber',{p_rows:data});toast(n+' importados');$('#cprev').textContent=n+' personas importadas.'});
}
