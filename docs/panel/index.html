<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><link rel="icon" href="../icon-192.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>

</head><body>
<title>A Quinta · Panel de administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Inter:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
/* Layout: una columna de trabajo (máx. 1080px); cabecera negra del club arriba, paneles de herramienta debajo. */
:root{
  --bg:#eef0f3; --surface:#ffffff; --surface2:#f5f6f8; --ink:#101215; --muted:#566070; --line:#d5dae1;
  --steel:#4E5A6B; --steel-soft:#e2e6ec; --gold:#8a6d2f;
  --ok:#1f6b3b; --ok-bg:#e1f0e6; --warn:#8d5300; --warn-bg:#fbeed6; --bad:#a3221a; --bad-bg:#f8e0de;
  --slot:#d9e3ef; --slot-line:#a9bbd1; --rival:#f2d6c2; --rival-line:#cf9b78; --us:#101215; --us-ink:#ffffff;
  --display:"Oswald","Arial Narrow",Arial,sans-serif; --body:"Barlow","Segoe UI",system-ui,sans-serif; --marker:"Permanent Marker","Comic Sans MS",cursive;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0c0e; --surface:#15171b; --surface2:#1b1e23; --ink:#f0f2f5; --muted:#9ba5b3; --line:#2a2f37;
  --steel:#a3b3c8; --steel-soft:#232a33; --gold:#C9B37E;
  --ok:#74d39a; --ok-bg:#15301f; --warn:#f1b65e; --warn-bg:#33270f; --bad:#f28c82; --bad-bg:#3a1714;
  --slot:#1d2a39; --slot-line:#3d5675; --rival:#3d2717; --rival-line:#8f5a36; --us:#f0f2f5; --us-ink:#0b0c0e;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0c0e; --surface:#15171b; --surface2:#1b1e23; --ink:#f0f2f5; --muted:#9ba5b3; --line:#2a2f37;
  --steel:#a3b3c8; --steel-soft:#232a33; --gold:#C9B37E;
  --ok:#74d39a; --ok-bg:#15301f; --warn:#f1b65e; --warn-bg:#33270f; --bad:#f28c82; --bad-bg:#3a1714;
  --slot:#1d2a39; --slot-line:#3d5675; --rival:#3d2717; --rival-line:#8f5a36; --us:#f0f2f5; --us-ink:#0b0c0e;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

/* Cabecera del club */
.club{background-color:#0c0c0c;color:#fff;background-image:repeating-linear-gradient(-58deg,rgba(255,255,255,.035) 0 3px,transparent 3px 26px),repeating-linear-gradient(-58deg,rgba(255,255,255,.025) 0 70px,transparent 70px 190px),radial-gradient(ellipse at 50% 0%,#262626 0%,#0c0c0c 65%)}
.club-in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px}
.club-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.club-name{font-family:var(--marker);font-size:30px;line-height:1;transform:rotate(-2deg)}
.club-sub{font-family:var(--display);font-weight:500;letter-spacing:.3em;font-size:12px;color:#C3CBD6;text-transform:uppercase}
.back{margin-left:auto;background:transparent;border:1.5px solid #6E7C90;color:#fff;border-radius:999px;padding:6px 14px;font-family:var(--display);letter-spacing:.08em;font-size:14px;cursor:pointer}
.back:hover{border-color:#fff}

.hero{padding-block:48px 56px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.hero .eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.35em;font-size:13px;color:#C3CBD6}
.hero h1{margin:0;font-family:var(--marker);font-weight:400;font-size:clamp(56px,14vw,120px);line-height:1;transform:rotate(-2deg);text-wrap:balance}
.hero .motto{font-family:var(--display);font-weight:500;letter-spacing:.3em;font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.hero .motto i{width:7px;height:7px;background:#8C98A8;display:inline-block}
.bigbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;width:100%;max-width:1000px;margin-top:34px}
.bigbtn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:#fff;color:#0c0c0c;border:0;border-radius:4px;padding:20px 22px;cursor:pointer;box-shadow:8px 8px 0 #4E5A6B;transition:transform .12s ease, box-shadow .12s ease}
.bigbtn:hover{transform:translate(-2px,-2px);box-shadow:10px 10px 0 #4E5A6B}
.bigbtn:focus-visible{outline:3px solid #C9B37E;outline-offset:4px}
.bigbtn b{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.bigbtn span{font-size:14px;color:#3d4552}
.hero .status{margin-top:26px;font-size:14px;color:#C3CBD6}

/* Tipos y piezas */
h2{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:.01em;margin:28px 0 4px;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:18px;margin:0;letter-spacing:.01em}
.lead{color:var(--muted);margin:0 0 18px;max-width:65ch}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0 6px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 9px;cursor:pointer;font-family:var(--display);font-size:16px;letter-spacing:.03em;color:var(--muted);display:flex;gap:8px;align-items:center}
.tab .n{font-size:12px;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab:focus-visible,.btn:focus-visible,.chip-btn:focus-visible,input:focus-visible,select:focus-visible,.opt:focus-visible{outline:2px solid var(--steel);outline-offset:2px}

.grid{display:grid;gap:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.edit{border-color:var(--steel);box-shadow:0 0 0 1px var(--steel) inset}
.card.new{border-style:dashed}
.card-head{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.card-head > div{min-width:0}
.meta{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0}
input[type=text],input[type=url],input[type=date],input[type=time],input[type=number],select{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
input:disabled,select:disabled{opacity:.6}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.check{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:14px;cursor:pointer}
.check input{margin:0;accent-color:var(--steel)}

.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 14px;font-family:var(--display);font-size:15px;letter-spacing:.04em;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);opacity:1}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;letter-spacing:.03em;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.steel{background:var(--steel-soft);color:var(--steel)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.steel::before{display:none}

.banner{border-radius:var(--r);padding:12px 14px;font-size:14px;background:var(--warn-bg);color:var(--warn);margin-top:14px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted);font-size:14px;background:var(--surface)}
details.sub{border-top:1px solid var(--line);padding-top:10px}
details.sub summary{cursor:pointer;font-weight:600;font-size:14px}
.mini{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.mini td,.mini th{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.mini th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto;max-width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}

/* Calendario del día */
.daybar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.daybar > label{max-width:200px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tl{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 0 12px}
.tl-in{position:relative}
.tl-row{display:flex;align-items:stretch;min-height:40px;border-top:1px solid var(--line)}
.tl-row:first-child{border-top:0}
.tl-lab{position:sticky;left:0;z-index:2;width:140px;flex:0 0 140px;background:var(--surface);padding:6px 10px;font-size:13px;font-weight:600;display:flex;align-items:center;line-height:1.2}
.tl-track{position:relative;flex:0 0 auto}
.tl-hours{display:flex;align-items:flex-end;height:22px}
.tl-hour{position:absolute;top:0;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;transform:translateX(-50%)}
.tl-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.blk{position:absolute;top:5px;bottom:5px;border-radius:6px;font-size:11.5px;line-height:1.15;padding:3px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.blk.slot{background:var(--slot);border:1px dashed var(--slot-line);top:3px;bottom:3px}
.blk.us{background:var(--us);color:var(--us-ink);font-weight:600}
.blk.us.bad{outline:2px solid var(--bad);outline-offset:1px}
.blk.rv{background:var(--rival);border:1px solid var(--rival-line)}
.blk.away{background:var(--steel-soft);border:1px solid var(--steel)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:2px 2px 0}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.plan{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
.plan th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line)}
.plan td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.plan tr.off td{color:var(--muted)}
.plan tr.off td.sel ~ td > *{opacity:.35}
.plan .team b{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.02em}
.plan input[type=time]{width:110px}
.plan input[type=text]{min-width:150px}
.grid > *{min-width:0}
.plan select{min-width:120px}
.issues{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.footbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}

/* Generar */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.opt{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;cursor:pointer;text-decoration:none;color:var(--ink)}
.opt:hover{border-color:var(--ink)}
.opt b{font-family:var(--display);font-size:22px;font-weight:600}
.opt span{color:var(--muted);font-size:14px}
.opt .tag{align-self:flex-start}
.gen{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
@media (max-width:760px){.gen{grid-template-columns:minmax(0,1fr)}}
.poster{background:#0c0c0c;border-radius:6px;padding:10px;display:flex;justify-content:center}
.poster canvas{width:100%;max-width:440px;height:auto;display:block}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:65ch}
@media (prefers-reduced-motion:reduce){.bigbtn{transition:none}}
@media (max-width:600px){.fields[style*="grid-template-columns"]{grid-template-columns:minmax(0,1fr)!important}}

/* Estilo del carnet de socio: negro, crema, Zilla Slab + Inter */
:root:root:root{--bg:#0B0B0B;--surface:#141414;--surface2:#1b1b1b;--ink:#F4F1EA;--muted:#A8A8A8;--line:#262626;--steel:#C8C8C8;--steel-soft:#232323;--gold:#E6DCC6;
 --ok:#8fd4a6;--ok-bg:#15281c;--warn:#efc177;--warn-bg:#2e2410;--bad:#f2968c;--bad-bg:#371614;
 --slot:#1d2530;--slot-line:#4a5a70;--rival:#3a2a1d;--rival-line:#8f6a46;--us:#F4F1EA;--us-ink:#0B0B0B;
 --display:"Zilla Slab",Georgia,serif;--body:"Inter",system-ui,sans-serif;color-scheme:dark}
body{background:var(--bg)}
.club{background:#0B0B0B;background-image:none;border-bottom:1px solid #262626}
.club-name{font-family:var(--display);font-weight:700;font-size:24px;transform:none;display:flex;align-items:center;gap:10px;letter-spacing:.5px}
.club-name img{width:40px;height:40px}
.club-sub{color:#A8A8A8;letter-spacing:.25em}
.back{border-color:#3a3a3a;color:#F4F1EA;font-family:var(--body);font-weight:600;font-size:13px;letter-spacing:.04em}
.hero .crest{width:150px;height:150px;margin-bottom:10px}
.hero h1{font-family:var(--display);font-weight:700;transform:none;font-size:clamp(46px,10vw,84px);letter-spacing:1px}
.hero .eyebrow,.hero .motto{font-family:var(--body);color:#A8A8A8}
.hero .motto i{background:#555}
.bigbtns{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.bigbtn{background:#141414;color:#F4F1EA;border:1px solid #262626;border-radius:18px;box-shadow:none}
.bigbtn:hover{transform:translateY(-2px);box-shadow:none;border-color:#F4F1EA}
.bigbtn b{font-family:var(--display);text-transform:none;font-size:24px}
.bigbtn span{color:#A8A8A8}
.bigbtn .ico{width:30px;height:30px;color:#F4F1EA}
.btn{background:#F4F1EA;color:#0B0B0B;border-color:#F4F1EA;font-family:var(--body);font-weight:600;border-radius:999px}
.btn.ghost{background:transparent;color:var(--ink);border-color:#3a3a3a}
.btn.danger{background:transparent}
.tab{font-family:var(--body);font-weight:600;font-size:14px}
.card,.daybar,.footbar,.tl{border-radius:18px}
.cnt{position:relative;width:100%;max-width:560px;aspect-ratio:856/540;border-radius:24px;background:#0B0B0B;border:1px solid #262626;overflow:hidden;color:#F4F1EA}
.cnt-mark{position:absolute;width:75%;right:-27%;top:-9%;opacity:.18}
.cnt-in{position:absolute;inset:0;padding:6% 6%;display:flex;flex-direction:column;justify-content:space-between}
.cnt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cnt-club{font-family:var(--display);font-weight:700;font-size:clamp(18px,4.5vw,28px);line-height:1}
.cnt-sub{font-size:10px;font-weight:600;letter-spacing:2.5px;opacity:.75}
.cnt-name{font-family:var(--display);font-weight:700;font-size:clamp(20px,5vw,32px);line-height:1.05;margin-top:4px}
.cnt-val{font-family:var(--display);font-weight:600;font-size:clamp(15px,3.4vw,20px)}
.cnt-tag{margin-left:auto;white-space:nowrap;position:relative;z-index:1;font-family:var(--display);font-weight:700;font-size:clamp(11px,2.4vw,14px);letter-spacing:1.5px;opacity:.85}
</style>

<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
"use strict";

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked" || k === "disabled" || k === "selected") el[k] = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)){ if (k == null || k === false) continue; el.append(k instanceof Node ? k : document.createTextNode(String(k))); }
  return el;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const toMin = t => { if (!t) return null; const [a,b] = t.split(":").map(Number); return a*60+(b||0); };
const toHM = m => String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0");
const pd = s => new Date(s + "T12:00:00");
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const addDays = (s,n) => { const d = pd(s); d.setDate(d.getDate()+n); return iso(d); };
const ddmm = s => { const d = pd(s); return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0"); };
const fechaLarga = s => { const d = pd(s); return DIAS_ES[d.getDay()] + " " + d.getDate() + "/" + (d.getMonth()+1); };
const today = () => iso(new Date());
const weekendKey = s => { const d = pd(s).getDay(); return addDays(s, d === 0 ? -1 : 6 - d); };
const sorted = (col) => Object.entries(S[col]).sort((a,b) => (a[1].orden ?? 0) - (b[1].orden ?? 0) || String(a[1].nombre||"").localeCompare(String(b[1].nombre||"")));
const cfg = () => ({ margen: 15, margenPab: 10, durRival: 60, ...(S.config.general || {}) });
const dur = eq => Number(eq && eq.duracion) || 60;
const eqLabel = eq => eq ? (eq.categoria || "") + " · " + (eq.nombre || "") : "Equipo borrado";
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600); }

/* ---------- datos ---------- */
function put(col, id, data){
  S[col][id] = data; render();
  if (db) db.collection(col).doc(id).set(data).catch(e => { toast(e.code === "quota_exceeded" ? "Se ha llenado el almacén de datos. Borra franjas o partidos antiguos." : "No se pudo guardar. Inténtalo de nuevo."); });
}
function patch(col, id, fields){ const cur = S[col][id]; if (!cur) return; put(col, id, { ...cur, ...fields }); }
function del(col, id){
  delete S[col][id]; render();
  if (db) db.collection(col).doc(id).delete().catch(() => toast("No se pudo borrar. Inténtalo de nuevo."));
}
async function initDb(){
  const sb = window.supabase.createClient(window.QT_CONFIG.url, window.QT_CONFIG.key);
  SB = sb;
  const {data:{session}} = await sb.auth.getSession();
  if (!session){ ui.view = "login"; dbMode = "ok"; render(); return; }
  const {data:me, error} = await sb.rpc("panel_me");
  if (error){ dbMode = "error"; render(); return; }
  ME = me || {modulos:[]};
  dl = { save: async ({filename, data}) => { const u = URL.createObjectURL(data); const a = document.createElement("a"); a.href = u; a.download = filename; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); } };
  const ref = (col, id) => ({
    set: async (data) => { const {error} = await sb.from("panel_docs").upsert({col, id, data, updated_at:new Date().toISOString()}); if (error) throw error; },
    delete: async () => { const {error} = await sb.from("panel_docs").delete().eq("col", col).eq("id", id); if (error) throw error; }
  });
  db = { collection: col => ({ doc: id => ref(col, id) }) };
  const load = async () => {
    const {data, error} = await sb.from("panel_docs").select("col,id,data").in("col", COLS);
    if (error){ dbMode = "error"; render(); return; }
    COLS.forEach(c => S[c] = {});
    (data || []).forEach(r => { S[r.col][r.id] = r.data; });
    dbMode = "ok"; render();
  };
  window.__recargar = load;
  await load();
  if (ME.super) await loadPerms();
  setInterval(() => { if (!document.hidden && !document.activeElement?.matches?.("input,select,textarea")) load(); }, 20000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
}

const franjasDe = f => Object.entries(S.franjas).filter(([,x]) => x.fecha === f).sort((a,b) => (a[1].desde||"").localeCompare(b[1].desde||""));

const durRiv = r => Number(r && r.duracion) || cfg().durRival;
const wkDates = wk => [addDays(wk, -1), wk, addDays(wk, 1)];

const franjasWk = wk => Object.entries(S.franjas).filter(([,x]) => weekendKey(x.fecha) === wk).sort((a,b) => (a[1].fecha + a[1].desde).localeCompare(b[1].fecha + b[1].desde));
function incompat(eid){
  const e = S.equipos[eid] || {}; const set = new Set(e.evitarEq || []);
  Object.entries(S.equipos).forEach(([oid,o]) => { if ((o.evitarEq || []).includes(eid)) set.add(oid); });
  set.delete(eid); return [...set].filter(x => S.equipos[x]);
}
function defaultWk(){
  const base = weekendKey(today());
  const cand = [...Object.values(S.partidos).map(p => weekendKey(p.fecha)), ...Object.values(S.franjas).map(f => weekendKey(f.fecha))].filter(k => k >= base).sort();
  return cand[0] || base;
}

function conflictos(pid, p){
  const eq = S.equipos[p.equipoId]; const out = [];
  if (!eq) return [{t:"bad", m:"El equipo ya no existe"}];
  if (!p.casa){ const w = []; if (!p.hora) w.push({t:"warn", m:"Falta la hora que pone el local"}); if (!p.rival) w.push({t:"warn", m:"Falta el rival"}); return w; }
  if (!p.hora) return [{t:"warn", m:"Sin hora: pulsa Proponer horarios"}];
  const s = toMin(p.hora), d = dur(eq), c = cfg();
  const hit = (r, dr, m) => s < r + dr + m && r < s + d + m;
  (eq.evitar || []).forEach(rid => {
    const rv = S.rivales[rid]; if (!rv) return;
    rivPartidos(rid, p.fecha).forEach(([,rp]) => { const r = toMin(rp.hora); if (r != null && hit(r, durRiv(rv), c.margen)) out.push({t:"bad", m:"Coincide con " + rv.nombre + " " + (rv.categoria||"") + " (" + rp.hora + ")"}); });
  });
  incompat(p.equipoId).forEach(oid => {
    partidosDe(p.fecha).forEach(([qid,q]) => { if (qid === pid || q.equipoId !== oid || !q.hora) return;
      if (hit(toMin(q.hora), dur(S.equipos[oid]), c.margen)) out.push({t:"bad", m:"Coincide con nuestro " + S.equipos[oid].categoria + " (" + q.hora + ")"}); });
  });
  const fr = franjasDe(p.fecha).filter(([,f]) => f.pabellonId === p.pabellonId);
  if (!fr.some(([,f]) => s >= toMin(f.desde) && s + d <= toMin(f.hasta))) out.push({t:"bad", m:"Fuera de las horas de " + pabNombre(p.pabellonId)});
  partidosDe(p.fecha).forEach(([qid,q]) => {
    if (qid === pid || !q.casa || q.pabellonId !== p.pabellonId || !q.hora) return;
    const e2 = S.equipos[q.equipoId]; const s2 = toMin(q.hora), d2 = dur(e2);
    if (s < s2 + d2 + c.margenPab && s2 < s + d + c.margenPab) out.push({t:"bad", m:"Pabellón ocupado por " + (e2 ? e2.categoria : "otro partido")});
  });
  if (!p.rival) out.push({t:"warn", m:"Falta el rival"});
  return out;
}

function proponer(wk){
  const c = cfg();
  const frs = franjasWk(wk).map(([,x]) => x);
  if (!frs.length){ toast("Este fin de semana no tiene horas de pabellón. Añádelas en Horas de pabellón."); return; }
  const all = partidosWk(wk);
  const occ = [];
  all.forEach(([,p]) => { if (!p.hora) return; const s = toMin(p.hora), e = s + dur(S.equipos[p.equipoId]);
    if (!p.casa) occ.push({fecha:p.fecha, pab:null, s, e, eid:p.equipoId});
    else if (p.fija || p.estado === "confirmado") occ.push({fecha:p.fecha, pab:p.pabellonId, s, e, eid:p.equipoId}); });
  const libres = all.filter(([,p]) => p.casa && !p.fija && p.estado !== "confirmado")
    .sort((a,b) => ((S.equipos[a[1].equipoId]||{}).orden ?? 0) - ((S.equipos[b[1].equipoId]||{}).orden ?? 0));
  const pabOrden = sorted("pabellones").map(([id]) => id);
  let sin = 0;
  libres.forEach(([pid,p]) => {
    const eq = S.equipos[p.equipoId]; const d = dur(eq); const inc = incompat(p.equipoId);
    const rv = [];
    (eq && eq.evitar || []).forEach(rid => { const r = S.rivales[rid]; if (!r) return;
      rivPartidos(rid).forEach(([,rp]) => { if (rp.hora && weekendKey(rp.fecha) === wk){ const s = toMin(rp.hora); rv.push({fecha:rp.fecha, s, e:s + durRiv(r)}); } }); });
    const ok = (fecha, pab, t, fd, fh) => t >= fd && t + d <= fh
      && !occ.some(o => o.fecha === fecha && o.pab && o.pab === pab && t < o.e + c.margenPab && o.s < t + d + c.margenPab)
      && !occ.some(o => o.fecha === fecha && inc.includes(o.eid) && t < o.e + c.margen && o.s < t + d + c.margen)
      && !rv.some(r => r.fecha === fecha && t < r.e + c.margen && r.s < t + d + c.margen)
      && cumpleNormas(eq, fecha, t, d, pab);
    let best = null;
    frs.forEach(fr => {
      const fd = toMin(fr.desde), fh = toMin(fr.hasta); if (fd == null || fh == null) return;
      const cand = new Set([fd]);
      occ.forEach(o => { if (o.fecha === fr.fecha){ cand.add(o.e + c.margenPab); cand.add(o.e + c.margen); } });
      rv.forEach(r => { if (r.fecha === fr.fecha) cand.add(r.e + c.margen); });
      for (let t = fd; t <= fh - d; t += 5) cand.add(t);
      const list = [...cand].filter(t => t >= fd).sort((a,b) => a - b);
      for (const t of list){ if (ok(fr.fecha, fr.pabellonId, t, fd, fh)){
        const key = fr.fecha + toHM(t);
        if (!best || key < best.key || (key === best.key && pabOrden.indexOf(fr.pabellonId) < pabOrden.indexOf(best.pab))) best = {key, fecha:fr.fecha, pab:fr.pabellonId, s:t};
        break; } }
    });
    if (best){ occ.push({fecha:best.fecha, pab:best.pab, s:best.s, e:best.s + d, eid:p.equipoId}); put("partidos", pid, {...p, fecha:best.fecha, hora:toHM(best.s), pabellonId:best.pab}); }
    else { sin++; put("partidos", pid, {...p, hora:""}); }
  });
  toast(sin ? sin + " partido(s) sin hueco libre. Revisa horas de pabellón o incompatibilidades." : "Horarios propuestos sin coincidencias.");
}

function parseFed(str){
  const map = {vie:"5", sab:"6", dom:"0"}; const out = [];
  String(str || "").split(";").forEach(part => {
    const m = part.trim().match(/^(vie|s[aá]b|dom)[a-zá]*\.?\s+(.+)$/i); if (!m) return;
    const d = map[m[1].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")];
    m[2].split(",").forEach(r => { const k = r.trim().match(/^(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})$/); if (k) out.push({d, desde:k[1].padStart(5,"0"), hasta:k[2].padStart(5,"0")}); });
  });
  return out;
}
function fedOk(e, fecha, t){
  const fed = parseFed(normas(e).fed); if (!fed.length) return true;
  const dow = String(pd(fecha).getDay());
  return fed.some(f => f.d === dow && t >= toMin(f.desde) && t <= toMin(f.hasta));
}
function cumpleNormas(e, fecha, t, d, pab){
  const n = normas(e); const dow = String(pd(fecha).getDay());
  if (!fedOk(e, fecha, t)) return false;
  if (n.dias.length && !n.dias.includes(dow)) return false;
  if (n.desde && t < toMin(n.desde)) return false;
  if (n.hasta && t + d > toMin(n.hasta)) return false;
  if (n.pabs.length && !n.pabs.includes(pab)) return false;
  return true;
}

  const us = e => ({name: e.nombre || "A Quinta F.S.", us:true});

  const ms = ps.map(p => { const e = S.equipos[p.equipoId];

  const an = fitWrap(c, m.away.name.toUpperCase(), {font:OS, weight:"600", size:Math.round(26*k), maxW:nameW, lines:2, min:13});
  drawLines(c, an, mx + mw - em - 8, ty, {font:OS, weight:"600", align:"right", lh:1.02});
  emblem(c, m.away, mx + mw - em/2, ty, Math.min(60*k, 60), false);
  c.save(); c.font = "500 " + Math.round(20*k) + "px " + OS; setLS(c, 1); const vw = Math.min(c.measureText(m.venue.toUpperCase()).width, mw - 40); c.restore();
  const vx = mx + mw/2 - (vw + 22)/2; pin(c, vx, vy - 8.5*k, 17*k, "#C3CBD6", "#0c0c0c");
  text(c, m.venue.toUpperCase(), vx + 22, vy, {font:OS, weight:"500", size:Math.round(20*k), ls:1, color:"#C3CBD6", align:"left", maxW:mw - 40});
  c.fillStyle = "#fff"; c.fillRect(X1 - 150, cy - 30*k, 3, 60*k);
  const t = text(c, m.time, X1, cy, {font:OS, weight:"700", size:Math.round(40*k), align:"right"});
  icon(c, CLOCK, X1 - t.w - 10 - 30*k, cy - 15*k, 30*k, "#fff", 2);
  c.fillStyle = "rgba(110,124,144,.55)"; c.fillRect(X0, y + rh - 1, X1 - X0, 1);
}
function drawPost(cv, hd, data){
  const W = 1080, H = 1350; cv.width = W; cv.height = H; const c = cv.getContext("2d");
  bgDraw(c, W, H); let y = headerDraw(c, W, 34, hd, 104, 24);
  y += 22; rule(c, 48, y, 984); y += 14;
  data.matches.slice(0,3).forEach(m => {
    y += 6;
    c.save(); c.font = "700 44px " + OS; setLS(c, 1); const cw = Math.min(c.measureText(m.cat).width + 108, 900); c.restore();
    brushBox(c, W/2, y + 32, cw, 64, -2, "#4E5A6B"); text(c, m.cat, W/2, y + 33, {font:OS, weight:"700", size:44, ls:1, rot:-2, maxW:cw - 60});
    y += 58;
    const colW = 392, lx = 48 + colW/2, rx = 48 + colW + 200 + colW/2, mid = y + 111;
    [[m.home, lx], [m.away, rx]].forEach(([t, cx]) => {
      const nm = fitWrap(c, t.name.toUpperCase(), {font:OS, weight:"600", size:34, maxW:380, lines:2, min:20});
      const nh = nm.lines.length * nm.sz * 1.05; const total = 150 + 6 + nh; const top = mid - total/2;
      emblem(c, t, cx, top + 75, 150, true);
      drawLines(c, nm, cx, top + 156 + nh/2, {font:OS, weight:"600", lh:1.05});
    });
    text(c, "VS", 48 + colW + 100, mid, {font:MK, size:124, rot:-6});
    y += 222; rule(c, 48, y, 984); y += 6;
    const u = 984/3.4, cols = [[48, u, CAL, ddmm(m.fecha)], [48 + u, u, CLOCK, m.time + " h."], [48 + 2*u, 1.4*u, null, m.venue.toUpperCase()]];
    const iy = y + 37;
    cols.forEach(([x0, w, ic, label], i) => {
      if (i < 2){ c.fillStyle = "#fff"; c.fillRect(x0 + w - 4, iy - 23, 4, 46); }
      c.save(); c.font = "600 " + (i === 2 ? 38 : 40) + "px " + OS; setLS(c, 0); let tw = c.measureText(label).width; c.restore();
      const maxT = w - 44 - 18 - 30; tw = Math.min(tw, maxT); const sx = x0 + w/2 - (44 + 18 + tw)/2;
      if (ic) icon(c, ic, sx, iy - 22, 44, "#fff", 2); else pin(c, sx + 2, iy - 23, 46, "#fff", "#0c0c0c");
      text(c, label, sx + 44 + 18, iy, {font:OS, weight:"600", size:i === 2 ? 38 : 40, align:"left", maxW:maxT});
    });
    y += 74; rule(c, 48, y, 984); y += 6;
  });
  footerDraw(c, W, H - 26 - 46, 56);
}

/* ---------- render con conservación de borradores ---------- */
function render(){
  const keep = {}; let focusId = null;
  document.querySelectorAll("[data-draft][id]").forEach(el => { keep[el.id] = el.type === "checkbox" ? el.checked : el.value; });
  document.querySelectorAll("input[class^='ev-']").forEach(el => { keep["#ev:" + el.className + ":" + el.value] = el.checked; });
  if (document.activeElement && document.activeElement.id) focusId = document.activeElement.id;
  const app = $("#app"); app.replaceChildren();
  const allow = {programar:"programar", generar:"generar", auto:"generar", manual:"generar", mails:"correo"};
  if (ui.view !== "login" && ui.view !== "home" && ui.view !== "permisos" && allow[ui.view] && !can(allow[ui.view]) && dbMode === "ok") ui.view = "home";
  const v = ui.view === "login" ? viewLogin() : ui.view === "permisos" ? viewPermisos() : ui.view === "programar" ? viewProgramar() : ui.view === "generar" ? viewGenerar() : ui.view === "auto" ? viewAuto() : ui.view === "manual" ? viewManual() : ui.view === "mails" ? viewMails() : viewHome();
  [v].flat().forEach(x => x && app.append(x));
  Object.entries(keep).forEach(([id, val]) => {
    if (id.startsWith("#ev:")){ const [, cls, value] = id.split(":"); const el = [...document.querySelectorAll("." + CSS.escape(cls))].find(e => e.value === value); if (el) el.checked = val; return; }
    const el = document.getElementById(id); if (el && el.hasAttribute("data-draft")) { if (el.type === "checkbox") el.checked = val; else if (val !== "" || el.tagName === "SELECT") el.value = val; }
  });
  if (focusId){ const el = document.getElementById(focusId); if (el) try { el.focus({preventScroll:true}); } catch {} }
}

const hash = (location.hash || "").slice(1);
if (["programar","generar","auto","manual","mails","permisos"].includes(hash)) ui.view = hash;
render();
initDb();
})();
</script>
